<style>
:root{
  --manas-origin:'KKD-MANAS-NBO-20260914-7c3e';
  --ink:#22203A; --paper:#FAF8FF; --surface:#FFFFFF; --muted:#7A7794; --line:#E4E1F0;
  --accent:#F0A030; --accent-ink:#2A1B00; --teal:#2BB3A3; --danger:#D9534F;
  --shadow:0 8px 28px rgba(34,32,58,.12); --bar:rgba(255,255,255,.92);
  --radius:18px;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ECE9F7; --paper:#16152A; --surface:#221F3A; --muted:#A39FBF; --line:#332F52;
    --shadow:0 8px 28px rgba(0,0,0,.45); --bar:rgba(34,31,58,.94); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ECE9F7; --paper:#16152A; --surface:#221F3A; --muted:#A39FBF; --line:#332F52;
  --shadow:0 8px 28px rgba(0,0,0,.45); --bar:rgba(34,31,58,.94); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--font-ui);margin:0;text-wrap:balance;line-height:1.15}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.screen[hidden]{display:none}

/* ---------- HOME ---------- */
#home{overflow:auto;-webkit-overflow-scrolling:touch}
.home-inner{width:100%;max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px 120px}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:28px;padding-bottom:12px}
.brand{font-family:var(--font-ui);font-weight:700;font-size:30px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}

/* guided tour */
#tour{position:fixed;inset:0;z-index:60}
#tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,18,40,.62);transition:all .35s ease;pointer-events:none}
#tour .tcard{position:absolute;left:16px;right:16px;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.28);font-family:inherit}
#tour .tcard h3{font-size:17px;font-weight:700;margin:0 0 4px}
#tour .tcard p{font-size:14.5px;line-height:1.4;color:var(--muted);margin:0 0 12px}
#tour .tcard .row{display:flex;gap:8px;align-items:center}
#tour .tcard .step{font-size:12.5px;color:var(--muted);margin-right:auto}
#tour .tcard .btn{padding:9px 16px;font-size:14px}
mark{background:rgba(255,196,80,.55);color:inherit;border-radius:3px;padding:0 1px}
.menu button span{min-width:0;overflow:hidden}
.portal{width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.portal svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.portal.lost{background:var(--danger)}
me-tpc.has-portal{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink)}
#back-btn.stacked{background:var(--ink);color:var(--paper)}

/* study */
#study{position:fixed;inset:0;z-index:70;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:12px}
#study .st-top{display:flex;align-items:center;gap:10px}
#study .st-top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#study .st-top span{font-size:13px;color:var(--muted)}
#study .st-x{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:24px;line-height:1;color:var(--ink)}
#study .st-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
#study .st-bar i{display:block;height:100%;background:var(--accent,#E8743B);transition:width .3s}
#study .st-card{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#study .st-card.q{flex:0 0 auto;min-height:120px}
#study .st-where{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#study .st-front{font-size:21px;font-weight:700;line-height:1.3}
#study .st-back{display:none;font-size:17px;line-height:1.45;border-top:1px dashed var(--line);padding-top:14px;white-space:normal}
#study .st-card.done{align-items:center;text-align:center}
#study .st-card.done .st-front{font-size:34px}
#study .st-foot{display:flex;gap:8px}
#study .st-foot .btn{flex:1;padding:14px 8px;font-size:15px}
#study .st-opts{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
#study .st-opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.35;color:var(--ink)}
#study .st-opt.ok{border-color:#2BB3A3;background:rgba(43,179,163,.14)}
#study .st-opt.bad{border-color:var(--danger);background:rgba(217,83,79,.12)}
#study[hidden]{display:none!important}
.menu button.on{outline:2px solid var(--ink);outline-offset:-2px}
/* libraries */
.libs{display:flex;flex-direction:column;gap:10px}
.lib-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.lib-row.on{border-color:var(--ink)}
.lib-ico{font-size:28px;width:40px;text-align:center;flex:none}
.lib-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lib-txt b{font-size:15.5px}
.lib-txt small{font-size:12.5px;color:var(--muted);line-height:1.3}
.lib-txt .lib-meta{font-size:11.5px;opacity:.85}
.btn.small{padding:8px 12px;font-size:13.5px;flex:none}
.btn.small.ghost{background:transparent;border:1px solid var(--line)}
.btn.small svg{width:16px;height:16px}
.icon-btn.small{width:38px;height:38px}.icon-btn.small svg{width:19px;height:19px}
.topbar .title-btn{font-size:15px;padding:8px 8px}
.new-map{margin-top:16px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:var(--radius);background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.new-map .plus{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.new-map .plus svg{width:26px;height:26px}
.new-map b{font-family:var(--font-ui);font-size:19px;font-weight:600;display:block}
.new-map span{font-size:14px;opacity:.75}
.new-map:active{transform:scale(.985)}
.new-map.alt{margin-top:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.new-map.alt .plus{background:var(--teal);color:#fff}
.new-map.alt span span{color:var(--muted);opacity:1}
.pick{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;font-size:15px;text-align:left;width:100%}
.pick .tick{position:static;flex:none}
.pick:active{background:var(--line)}
.section-label{margin:28px 0 10px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:150px}
.card:active{transform:scale(.97)}
.card .preview{height:64px;border-radius:12px;position:relative;overflow:hidden}
.card .preview i{position:absolute;display:block;height:4px;border-radius:2px;opacity:.9}
.card .preview b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.card h3{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.card .more{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);color:#22203A}
.card .more svg{width:18px;height:18px}
.empty{padding:30px 10px;color:var(--muted);text-align:center}
.home-copyright{margin:40px 0 0;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

/* ---------- EDITOR ---------- */
#editor{background:var(--paper)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(var(--bar),rgba(255,255,255,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.title-btn{flex:1;min-width:0;text-align:left;font-family:var(--font-ui);font-weight:600;font-size:17px;padding:8px 10px;border-radius:12px;background:var(--bar);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}
.tb{background:var(--bar);backdrop-filter:blur(8px)}
#map{position:absolute!important;inset:0;width:100%;height:100%!important}
.map-container .selected{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.map-container me-root me-tpc{font-family:var(--font-ui);font-weight:600}
.map-container me-tpc{font-family:var(--font-body)}
.map-container #input-box{font-size:16px}

.map-container me-tpc .grab{pointer-events:auto;position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent, #F0A030);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);top:50%;transform:translate(-50%,-50%);z-index:60;touch-action:none;cursor:grab;display:grid;place-items:center}
.map-container me-tpc .grab::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.map-container me-tpc .grab::after{content:'';position:absolute;inset:-14px}
.map-container me-tpc .grab.left{left:0}.map-container me-tpc .grab.right{left:100%}.map-container me-tpc .grab.top{left:50%;top:0}
.map-container me-tpc.drop-in{outline:3px dashed var(--accent,#F0A030)!important;outline-offset:3px;border-radius:8px}
.map-container me-tpc.drop-before{box-shadow:0 -6px 0 -2px var(--accent,#F0A030)}
.map-container me-tpc.drop-after{box-shadow:0 6px 0 -2px var(--accent,#F0A030)}
.thread-ghost{position:fixed;z-index:500;pointer-events:none;transform:translate(-50%,-50%);padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--font-ui);font-weight:600;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
/* shapes */
.map-container me-parent me-tpc{transition:border-radius .25s,transform .25s,box-shadow .25s}
.map-container me-tpc[data-shape="pill"]{border-radius:999px!important;padding-left:16px!important;padding-right:16px!important}
.map-container me-tpc[data-shape="box"]{border-radius:4px!important}
.map-container me-tpc[data-shape="circle"]{border-radius:50%!important;aspect-ratio:1;display:flex!important;align-items:center;justify-content:center;text-align:center;padding:14px!important;min-width:3.2em}
.map-container me-tpc[data-shape="cloud"]{border-radius:55% 45% 50% 50% / 60% 55% 45% 40%!important;padding:12px 20px!important}
.map-container me-tpc[data-shape="note"]{border-radius:2px!important;background:#FFF3B0!important;color:#22203A!important;transform:rotate(-1.5deg);box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:10px 14px!important;border-color:transparent!important}
.map-container me-tpc[data-shape="under"]{border-radius:0!important;background:transparent!important;border:0!important;border-bottom:3px solid var(--main-color)!important;padding-left:4px!important;padding-right:4px!important}
.map-container me-parent me-tpc[data-shape]:not([data-shape="under"]):not([data-shape="note"]){border:2px solid var(--main-color);background-color:var(--main-bgcolor)}
/* live content on the bubble */
.map-container me-tpc .mx{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin:0 4px;pointer-events:none}
.map-container me-tpc .mx .tick,.map-container me-tpc .mx .portal{pointer-events:auto}
.map-container me-tpc.done>.text{text-decoration:line-through;opacity:.6}
.tick{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:13px;font-weight:800;line-height:1;opacity:.75;flex:none;transition:transform .15s,background .15s}
.tick.on{background:#2BB3A3;border-color:#2BB3A3;color:#fff;opacity:1}
.tick:active{transform:scale(.85)}
.ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(#2BB3A3 calc(var(--p)*1%),rgba(120,120,140,.22) 0);display:inline-grid;place-items:center;position:relative;flex:none}
.ring i{position:absolute;inset:4px;border-radius:50%;background:var(--main-bgcolor,#fff)}
.ring b{position:relative;font-size:8px;font-weight:800;line-height:1}
.due{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(120,120,140,.15);white-space:nowrap}
.due.soon{background:#FDE2B3;color:#7A4A00}.due.late{background:#FFB7B2;color:#7A1E1A}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#F0A030;color:#2A1B00;font-size:11px;font-weight:800;display:inline-grid;place-items:center;line-height:1}
/* lines */
.map-container.line-thin .lines path{stroke-width:1.5}.map-container.line-thin .subLines path{stroke-width:1.2}
.map-container.line-bold .lines path{stroke-width:5}.map-container.line-bold .subLines path{stroke-width:3.2}
.map-container .lines path,.map-container .subLines path{stroke-linecap:round;stroke-linejoin:round}
.map-container me-tpc.merge-pick{outline:3px solid #2BB3A3;outline-offset:2px;border-radius:6px}
.map-container .topiclinks path[stroke]{pointer-events:stroke}
.map-container me-tpc .story-badge{position:absolute;top:-12px;left:-12px;width:24px;height:24px;border-radius:50%;background:#F0A030;color:#2A1B00;font-family:var(--font-ui);font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;pointer-events:none;z-index:20}
.story-cap{position:absolute;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:29;background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.story-cap b{display:block;font-family:var(--font-ui);font-size:17px;line-height:1.2}
.story-cap span{display:block;font-size:14px;color:var(--muted);margin-top:4px;max-height:5.6em;overflow:auto}
.steps{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.5;max-height:32dvh;overflow:auto}
/* movement and feel */
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.07)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes wiggle{0%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-50%) rotate(3deg)}100%{transform:translate(-50%,-50%) rotate(-3deg)}}
.map-container me-tpc.fresh{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.map-container me-tpc.selected{animation:bounce .3s ease-out}
.map-container me-tpc[data-shape="note"].selected{animation:none}
.thread-ghost{animation:wiggle .6s ease-in-out infinite}
.grab{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.act:active svg{transform:scale(.85)}.act svg{transition:transform .12s}
@media (prefers-reduced-motion:reduce){.map-container me-tpc.fresh,.map-container me-tpc.selected,.thread-ghost,.grab{animation:none}}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.shape{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;font-size:12px}
.shape.on{border-color:var(--accent)}
.shape i{display:block;width:44px;height:24px;border:2px solid var(--ink);background:var(--paper)}
.shape i[data-shape="auto"]{border-radius:8px;border-style:dashed}
.shape i[data-shape="pill"]{border-radius:999px}.shape i[data-shape="box"]{border-radius:3px}
.shape i[data-shape="circle"]{width:26px;height:26px;border-radius:50%}
.shape i[data-shape="cloud"]{border-radius:55% 45% 50% 50% / 60% 55% 45% 40%}
.shape i[data-shape="note"]{border-radius:2px;background:#FFF3B0;border-color:transparent;transform:rotate(-4deg);box-shadow:1px 2px 4px rgba(0,0,0,.2)}
.shape i[data-shape="under"]{border-width:0 0 3px 0;background:transparent}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 10px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.dock-inner{pointer-events:auto;display:flex;gap:2px;padding:6px;border-radius:22px;background:var(--bar);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;scrollbar-width:none}
.dock-inner::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:46px;height:58px;padding:0 2px;border-radius:16px;color:var(--ink);font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:.01em;flex:none}
.act svg{width:22px;height:22px}
.act:active{background:var(--line)}
.act.primary{background:var(--accent);color:var(--accent-ink)}
.act.danger{color:var(--danger)}
.act[disabled]{opacity:.35}
.hint{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:29;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.hint.show{opacity:.92}

/* ---------- SHEETS ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,18,40,.45)}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:85dvh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:4px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:14px;padding:14px 8px;border-radius:12px;font-size:16px;text-align:left;width:100%}
.menu button svg{width:22px;height:22px;flex:none;color:var(--muted)}
.menu button:active{background:var(--line)}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:2px solid var(--line);text-align:left}
.swatch.on{border-color:var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:14px;height:14px;border-radius:50%;display:block}
.swatch b{font-family:var(--font-ui);font-weight:600;font-size:14px}
.swatch .bg{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;font-size:15px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.colors button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.colors button.none{border:2px dashed var(--muted);background:transparent;font-size:12px;font-weight:700;color:var(--muted)}
.colors button:active{transform:scale(.9)}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.emojis button{aspect-ratio:1;font-size:26px;border-radius:12px}
.emojis button:active{background:var(--line)}
.emojis button.none{font-size:12px;font-weight:700;color:var(--muted);border:2px dashed var(--muted)}
.field{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.field:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:14px;font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--line);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{background:var(--danger);color:#fff}
.preview-img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;font-size:14px}
.tile svg{width:26px;height:26px}
.tile:active{background:var(--line)}
.tile.danger{color:var(--danger)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;min-height:40px}
.stk{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;padding:4px}
.stk img{width:100%;height:100%;object-fit:contain}
.stk:active{background:var(--line)}
.pad-wrap{width:min(100%,52dvh);aspect-ratio:1;margin:0 auto 12px;border-radius:16px;border:2px dashed var(--line);background:#fff;background-image:radial-gradient(#e6e3f0 1px,transparent 1px);background-size:18px 18px;overflow:hidden;touch-action:none}
#pad{width:100%;height:100%;display:block;touch-action:none}
.draw-colors{grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:10px}

/* ---------- ORBIT (3D) — dark cosmos, whatever the phone theme ---------- */
#orbit{--void:#0B0A18;--void2:#17152E;--ink:#ECE9F7;--paper:#ECE9F7;--muted:#9591B5;--line:rgba(236,233,247,.14);--bar:rgba(23,21,46,.86);--shadow:0 10px 34px rgba(0,0,0,.5);color:var(--paper);
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 52%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 33% 62%, rgba(255,255,255,.5) 50%, transparent 52%),
    radial-gradient(1px 1px at 61% 78%, rgba(255,255,255,.35) 50%, transparent 52%),
    radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.45) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 8% 85%, rgba(255,255,255,.3) 50%, transparent 52%),
    radial-gradient(1px 1px at 48% 30%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(120% 90% at 50% 12%, #201c3e 0%, #0B0A18 60%);
  background-color:#0B0A18}
#orbit .oscene{position:absolute;inset:0;touch-action:none;cursor:grab}
#orbit .oscene:active{cursor:grabbing}
#orbit .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#orbit .bubble{position:absolute;top:0;left:0;max-width:170px;padding:9px 14px;border-radius:18px;text-align:center;font-family:var(--font-ui);font-weight:600;font-size:12.5px;line-height:1.25;color:var(--paper);background:rgba(20,18,42,.62);border:1.5px solid var(--c,#fff);box-shadow:0 0 16px -4px var(--c,#fff);cursor:pointer;user-select:none;-webkit-user-select:none;will-change:transform;transition:box-shadow .18s}
#orbit .bubble small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c,#fff);margin-bottom:2px;opacity:.95}
#orbit .bubble.l0{max-width:220px;font-size:15.5px;padding:13px 20px;background:rgba(255,255,255,.1)}
#orbit .bubble.l0 small{font-size:10px}
#orbit .bubble.l2{max-width:150px;font-size:11.5px;padding:7px 11px;background:rgba(20,18,42,.72)}
#orbit .bubble.sel{box-shadow:0 0 0 3px var(--c,#fff),0 0 24px 2px var(--c,#fff)}
#orbit .bubble .kids.stepno{background:#F0A030;color:#2A1B00;top:-10px;left:-10px;right:auto;min-width:24px;height:24px;font-size:12px;box-shadow:0 0 0 2px #fff}
#orbit .bubble .kids{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--c,#fff);color:#15132a;font-size:10.5px;font-weight:800;display:grid;place-items:center}
#orbit .otop{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;pointer-events:none}
#orbit .otop>*{pointer-events:auto}
#orbit .otitle{flex:1;min-width:0;padding:4px 2px}
#orbit .otitle b{display:block;font-family:var(--font-ui);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orbit .otitle span{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orbit .ctrl{background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(10px);font-family:var(--font-ui);font-weight:600;font-size:13px;padding:9px 13px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--paper)}
#orbit .ctrl svg{width:16px;height:16px}
#orbit .ctrl.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#orbit .ctrl:active{transform:scale(.96)}
#orbit.presenting .otop .ctrl:not(#o-back){display:none}
#orbit .olegend{position:absolute;left:16px;z-index:15;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#orbit .olegend span{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-ui)}
#orbit .olegend i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 1px var(--c)}
#orbit .ocaption{position:absolute;left:0;right:0;bottom:0;z-index:12;pointer-events:none;padding:40px 18px calc(92px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(11,10,24,0),rgba(11,10,24,.9) 45%)}
#orbit .cap-inner{max-width:560px;margin:0 auto}
#orbit .caplink{pointer-events:auto;margin-top:8px;text-decoration:none;font-size:12.5px;padding:7px 12px}
#orbit .cap-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
#orbit .pill{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
#orbit .cap-title{font-family:var(--font-ui);font-weight:700;font-size:18px;line-height:1.25;text-wrap:balance}
#orbit .cap-desc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#orbit.presenting .cap-title{font-size:21px}
#orbit.presenting .cap-desc{font-size:15.5px;color:#C9C5E2}
#orbit .act.on{color:var(--accent)}
#orbit .act[disabled]{opacity:.35}
#orbit .pstep{align-self:center;font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#orbit.presenting .odock{display:none}
.lbl{display:block;margin:16px 0 7px;font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ocolors{display:flex;flex-wrap:wrap;gap:10px}
.ocolors button{width:34px;height:34px;aspect-ratio:auto;border-radius:50%;border:3px solid transparent}
.ocolors button.on{border-color:var(--ink)}
.ocolors button.none{width:auto;padding:0 10px;border-radius:999px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tips{font-size:14px;color:var(--muted);line-height:1.6}
.tips b{color:var(--ink)}
.tips li{margin-bottom:6px}
</style>

<!-- ================= HOME ================= -->
<div class="screen" id="home">
  <div class="home-inner">
    <div class="home-top">
      <h1 class="brand">Manas<small>Mind maps</small></h1>
      <button class="icon-btn" id="home-menu-btn" aria-label="Settings and backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
      </button>
    </div>
    <button class="new-map" id="new-map-btn">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span><b>New mind map</b><span>Start with one idea in the middle</span></span>
    </button>
    <button class="new-map alt" id="from-text-btn" hidden>
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></span>
      <span><b>Map from your words</b><span>Speak or type a few sentences; AI lays it out</span></span>
    </button>
    <div class="section-label" id="maps-label">Your maps</div>
    <input class="field" id="home-search" type="search" placeholder="Find a map or an idea" autocomplete="off" hidden style="margin:0 0 12px">
    <div class="grid" id="grid"></div>
    <div id="hits"></div>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div class="screen" id="editor" hidden>
  <div id="map"></div>
  <div class="topbar">
    <button class="icon-btn tb" id="back-btn" aria-label="Back to your maps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

    <button class="icon-btn tb small" id="redo-btn" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="icon-btn tb" id="theme-btn" aria-label="Look and layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.3" fill="currentColor"/><circle cx="12.5" cy="7.5" r="1.3" fill="currentColor"/><circle cx="16" cy="10.5" r="1.3" fill="currentColor"/><path d="M12 21c-1.5 0-2.5-1-2.5-2.3 0-1.4 1.1-1.7 1.1-2.7 0-.8-.6-1-1.6-1H8"/></svg></button>
    <button class="icon-btn tb" id="editor-menu-btn" aria-label="More"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg></button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="story-cap" id="story-cap" hidden><b></b><span></span></div>
  <div class="dock"><div class="dock-inner" id="dock"></div></div>
</div>


<!-- ================= ORBIT (3D) ================= -->
<div class="screen" id="orbit" hidden>
  <div class="oscene" id="o-scene"><svg class="edges" id="o-edges"></svg><div id="o-layer"></div></div>
  <div class="otop">
    <button class="ctrl" id="o-flat" aria-label="Back to the flat map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Flat</button>
    <button class="ctrl" id="o-back" hidden aria-label="Back to the level above"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Up</button>
    <div class="otitle"><b id="o-name"></b><span id="o-path"></span></div>
    <button class="ctrl" id="o-view">View</button>
    <button class="ctrl accent" id="o-present">Present</button>

  <div class="olegend" id="o-legend" hidden></div>
  <div class="ocaption"><div class="cap-inner">
    <div class="cap-meta" id="o-cap-meta"></div>

  </div></div>
  <div class="dock odock"><div class="dock-inner" id="o-dock"></div></div>
  <div class="dock opbar" id="o-pbar" hidden><div class="dock-inner">
    <button class="act" id="o-pprev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Previous</span></button>
    <button class="act" id="o-prot"></button>
    <span class="pstep" id="o-pstep"></span>
    <button class="act primary" id="o-pnext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg><span>Next</span></button>
    <button class="act" id="o-pexit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Exit</span></button>
  </div></div>
</div>

  garden:  { name:'Garden', type:'light', palette:['#3F8F4E','#7CB342','#2E9E8F','#9AB83A','#4C9F70','#6FA35B','#A2B93C','#5D8A66','#8BC34A','#3A9D5D'],

  berry:   { name:'Berry', type:'light', palette:['#8E44AD','#C94C8B','#E06C9F','#6C5CE7','#B5179E','#7209B7','#D45D79','#9B5DE5','#F15BB5','#5F27CD'],
    cssVar:{ '--bgcolor':'#F8EEF6','--color':'#3A2440','--main-color':'#3A2440','--main-bgcolor':'#FFFFFF','--root-color':'#FFFFFF','--root-bgcolor':'#8E44AD','--root-border-color':'transparent','--selected':'#F0A030','--panel-color':'58, 36, 64','--panel-bgcolor':'255, 255, 255' } },
  paper:   { name:'Paper', type:'light', palette:['#22203A','#4A4766','#6E6B8A','#22203A','#4A4766','#6E6B8A','#22203A','#4A4766','#6E6B8A','#22203A'],
    cssVar:{ '--bgcolor':'#FBFAF5','--color':'#22203A','--main-color':'#22203A','--main-bgcolor':'#FBFAF5','--root-color':'#FBFAF5','--root-bgcolor':'#22203A','--root-border-color':'transparent','--selected':'#F0A030','--panel-color':'34, 32, 58','--panel-bgcolor':'255, 255, 255' } },
  night:   { name:'Night', type:'dark', palette:['#F2A93B','#2BB3A3','#F06292','#7E9CFF','#A5D66F','#FF8A65','#BA68C8','#4FC3F7','#FFD54F','#80CBC4'],
    cssVar:{ '--bgcolor':'#1B1A2E','--color':'#ECE9F7','--main-color':'#ECE9F7','--main-bgcolor':'#2A2846','--root-color':'#1B1A2E','--root-bgcolor':'#F2A93B','--root-border-color':'transparent','--selected':'#2BB3A3','--panel-color':'236, 233, 247','--panel-bgcolor':'42, 40, 70' } },
  chalk:   { name:'Chalk', type:'dark', palette:['#FFD3B6','#B5EAD7','#C7CEEA','#FFDAC1','#E2F0CB','#FFB7B2','#A0E7E5','#F8E1F4','#FDE2B3','#CDE7F0'],
    cssVar:{ '--bgcolor':'#2B3A42','--color':'#F4F1EA','--main-color':'#F4F1EA','--main-bgcolor':'#35464F','--root-color':'#2B3A42','--root-bgcolor':'#F4F1EA','--root-border-color':'transparent','--selected':'#FFD3B6','--panel-color':'244, 241, 234','--panel-bgcolor':'53, 70, 79' } },
};
const LAYOUTS = { side:{label:'Both sides', dir:2}, right:{label:'To the right', dir:1}, down:{label:'Downwards', dir:3} };
const NODE_COLORS = ['#FDE2B3','#FFD3B6','#FFB7B2','#F8D7E8','#E1D5F5','#C7CEEA','#CDE7F0','#B5EAD7','#E2F0CB','#FFF3B0','#E0E0E0','#22203A'];
const EMOJIS = ['⭐','❤️','✅','❗','❓','💡','🔥','🎯','📌','📅','💰','📞','✉️','🏠','🏥','🙏','🎵','📚','🛒','✈️','⏰','😀','😐','😟','👍','👎','🚀','🌱'];

/* ---------------- storage (IndexedDB, with migration from v1 localStorage) ---------------- */
const idb = {
  db:null,
  open(){ return new Promise((res,rej)=>{ if (this.db) return res(this.db); const r = indexedDB.open('manas', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('maps', { keyPath:'id' }); };
    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  tx(mode){ return this.db.transaction('maps', mode).objectStore('maps'); },
  all(){ return new Promise((res,rej)=>{ const r = this.tx('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); },
  put(m){ return new Promise((res,rej)=>{ const r = this.tx('readwrite').put(m); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  del(id){ return new Promise((res,rej)=>{ const r = this.tx('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
};
let maps = [];
function saveMap(m){ idb.put(JSON.parse(JSON.stringify(m))).catch(()=>toast('Could not save on this device')); }
function saveMaps(list){ for (const m of list) saveMap(m); }
function deleteMap(id){ idb.del(id).catch(()=>{}); }
function loadSettings(){ try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'); }catch(e){ return {}; } }
function saveSettings(s){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
let settings = Object.assign({ lastLook:'sunrise', lastLayout:'side', seenHelp:false }, loadSettings());

function countNodes(n){ return n ? 1 + (n.children||[]).reduce((a,c)=>a+countNodes(c),0) : 0; }
function relTime(ts){
  const d = Date.now()-ts, m=Math.round(d/60000), h=Math.round(d/3600000), dd=Math.round(d/86400000);
  if (m<1) return 'just now'; if (m<60) return m+' min ago'; if (h<24) return h+' h ago'; if (dd<7) return dd+' d ago';
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ---------------- sample map (first run) ---------------- */
const GUIDE_TITLE = 'How to use Manas';
const BIG_MAP = 600; // above this many ideas a map opens folded
function openGuide(){
  let g = maps.find(m => m.title === GUIDE_TITLE);
  if (!g){ g = sampleMap(); maps.unshift(g); saveMap(g); renderHome(); toast('Guide map added'); }
  openMap(g.id, false);
}
function sampleMap(){
  const N = (topic, children, extra) => Object.assign({ id: uid(), topic, children: children||[] }, extra||{});
  return {
    id: uid(), guide:true, title:'How to use Manas', look:'sunrise', layout:'side', created:Date.now(), updated:Date.now(),
    data: { direction:2, nodeData: N('How to use Manas', [
      N('Tap a bubble to select it', [ N('Then use the buttons at the bottom'), N('Double-tap to change the words') ], {icons:['👆']}),
      N('Add ideas', [ N('Child adds a branch under it'), N('Sibling adds one next to it'), N('Keep typing, press Enter to finish') ], {icons:['➕']}),
      N('Make it yours', [ N('Picture adds a little cartoon, a drawing or a photo', null, {image:{url:'sticker:1F3A8',width:56,height:56}}), N('Colour gives a bubble a tint', null, {style:{background:'#FDE2B3',color:'#22203A'}}), N('Emoji marks what matters', null, {icons:['⭐']}), N('Look changes colours of the whole map'), N('Style gives shapes and sizes', null, {manas:{shape:'cloud'}}), N('Tick boxes turn ideas into tasks', null, {manas:{task:true,done:true}}), N('With due dates and badges', null, {manas:{task:true,due:'2026-10-01',badge:'3'}}) ], {icons:['🎨']}),
      N('Move around', [ N('Drag the empty space to pan'), N('Pinch to zoom'), N('Drag a bubble onto another to move it') ], {icons:['🧭']}),
      N('Everything saves by itself', [ N('Maps live on this phone'), N('Backup from the home screen menu'), N('Share a picture from the ⋯ menu') ], {icons:['💾'], image:{url:'sticker:1F4BE',width:48,height:48}}),
    ]) }
  };
}

/* ---------------- home ---------------- */
const grid = $('#grid');
function renderHome(){
  const ft = $('#from-text-btn'); if (ft) ft.hidden = !ai;
  maps.sort((a,b)=>b.updated-a.updated);
  grid.innerHTML = '';
  $('#maps-label').textContent = maps.length ? `Your maps · ${maps.length}` : 'Your maps';
  const sq = $('#home-search'); sq.hidden = maps.length < 8; if (sq.hidden) sq.value = '';
  const q = sq.value.trim().toLowerCase();
  if (!maps.length){ grid.innerHTML = '<div class="empty">No maps yet. Tap “New mind map” to begin.</div>'; return; }
  const shown = q ? maps.filter(m => fold(m.title).includes(fold(q))) : maps;
  const hitsEl = $('#hits'); hitsEl.innerHTML = '';
  if (q.length >= 2){
    const hits = searchAll(q, 60);
    if (hits.length){
      hitsEl.innerHTML = `<div class="section-label" style="margin-top:18px">Ideas · ${hits.length}${hits.length >= 60 ? '+' : ''}</div><div class="menu" id="hit-list"></div>`;
      const list = $('#hit-list', hitsEl);
      for (const h of hits){ const b = document.createElement('button'); b.innerHTML = `${ico('search')}<span>${mark(h.note || h.topic, q)}<br><small style="color:var(--muted)">${esc((h.map.title||'Untitled').slice(0,40))}${h.where ? ' › ' + esc(h.where.slice(0,30)) : ''}</small></span>`; b.onclick = () => jumpTo(h); list.appendChild(b); }
    }
  }
  if (!shown.length){ grid.innerHTML = hitsEl.innerHTML ? '' : '<div class="empty">Nothing with that word in any map.</div>'; return; }
  for (const m of shown){
    const look = LOOKS[m.look] || LOOKS.sunrise;
    const card = document.createElement('button'); card.className='card'; card.setAttribute('data-id', m.id);
    const branches = (m.data.nodeData.children||[]).length;
    let lines=''; const shown=Math.min(branches,6);
    for (let i=0;i<shown;i++){ const ang=(i/shown)*Math.PI*2; const x=50+Math.cos(ang)*24, y=50+Math.sin(ang)*30; const w=22+((i*37)%18);

/* ---------------- search: across all maps (home) and inside one map ---------------- */
function fold(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); } // Prahlāda matches "prahlada"
function walkNodes(n, fn, parent){ if (!n) return; fn(n, parent); for (const c of (n.children||[])) walkNodes(c, fn, n); }
function searchAll(q, limit){
  q = fold(q); const hits = [];
  for (const m of maps){
    walkNodes(m.data && m.data.nodeData, (n, parent) => {
      if (hits.length >= limit) return;
      const t = String(n.topic||''), note = String(n.note||'');
      if (fold(t).includes(q) || fold(note).includes(q)) hits.push({ map: m, id: n.id, topic: t, where: parent ? String(parent.topic||'') : '', note: fold(note).includes(q) && !fold(t).includes(q) ? note : '' });
    });
    if (hits.length >= limit) break;
  }
  return hits;
}
function mark(text, q){ const i = fold(text).indexOf(fold(q)); if (i < 0 || fold(text).length !== text.length) return esc(text.slice(0,100)); const a = Math.max(0, i-30); return (a?'…':'') + esc(text.slice(a,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length, i+q.length+50)); }
function findNodeObj(id){ let found = null; walkNodes(mind && mind.nodeData, n => { if (n.id === id) found = n; }); return found; }
function revealNode(id){
  const n = findNodeObj(id); if (!n) return;
  const chain = []; let p = n.parent; while (p){ chain.unshift(p); p = p.parent; }
  for (const a of chain){ if (a.expanded === false){ const ae = MindElixir.E(a.id); if (ae) mind.expandNode(ae, true); } }
  const el = MindElixir.E(id); if (el){ mind.selectNode(el); mind.scrollIntoView(el, true); el.classList.add('fresh'); setTimeout(() => el.classList.remove('fresh'), 900); }
}
async function jumpTo(hit){
  closeSheet();
  if (!current || current.id !== hit.map.id) await openMap(hit.map.id, false);
  setTimeout(() => revealNode(hit.id), 350);
}

    if (op.name==='addChild' || op.name==='insertSibling'){ const el = op.obj && MindElixir.E(op.obj.id); if (el){ el.classList.add('fresh'); setTimeout(()=>el.classList.remove('fresh'), 500); } }

const LINE_STYLES = { curved:'Curved', straight:'Straight', elbow:'Elbow', sketchy:'Sketchy' };
const LINE_WEIGHTS = { thin:'Thin', normal:'Normal', bold:'Bold' };
function wobble(path, seed){ // sample an SVG path into a slightly shaky polyline
  const p = document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d', path);
  let len; try { len = p.getTotalLength(); } catch(e){ return path; } if (!len) return path;
  const n = Math.max(6, Math.min(24, Math.round(len/18))); let d = '';
  for (let i=0;i<=n;i++){ const pt = p.getPointAtLength(len*i/n); const h = Math.sin(seed*12.9898 + i*78.233)*43758.5453; const off = (h - Math.floor(h) - 0.5) * (i===0||i===n ? 0 : 3.2);
    d += (i?' L ':'M ') + (pt.x + off).toFixed(1) + ' ' + (pt.y + off*0.6).toFixed(1); }
  return d;
}
function lineFns(style){
  if (!style || style==='curved') return {};
  const main = function(p){ const {pT,pL,pW,pH,cT,cL,cW,cH,direction} = p; const py = pT+pH/2, cy = cT+cH/2;
    let px = pL+pW/2, cx = direction==='lhs' ? cL+cW : cL; if (direction==='down'){ px = pL+pW/2; const py2 = pT+pH; const cx2 = cL+cW/2; return style==='elbow' ? `M ${px} ${py2} V ${(py2+cT)/2} H ${cx2} V ${cT}` : style==='straight' ? `M ${px} ${py2} L ${cx2} ${cT}` : wobble(`M ${px} ${py2} Q ${px} ${cT} ${cx2} ${cT}`, px+cx2); }
    if (style==='straight') return `M ${px} ${py} L ${cx} ${cy}`;
    if (style==='elbow') return `M ${px} ${py} H ${(px+cx)/2} V ${cy} H ${cx}`;
    return wobble(`M ${px} ${py} Q ${px} ${cy} ${cx} ${cy}`, px+cy); };
  const sub = function(p){ const {pT,pL,pW,pH,cT,cL,cW,cH,direction,isFirst} = p; const gap = parseInt(this.container.style.getPropertyValue('--node-gap-x'))||30;
    if (direction==='down'){ const px = pL+pW/2, py = pT+pH, cx = cL+cW/2; return style==='elbow' ? `M ${px} ${py} V ${(py+cT)/2} H ${cx} V ${cT}` : style==='straight' ? `M ${px} ${py} L ${cx} ${cT}` : wobble(`M ${px} ${py} Q ${px} ${cT} ${cx} ${cT}`, px+cx); }
    const py = isFirst ? pT+pH/2 : pT+pH, cy = cT+cH;
    const px = direction==='lhs' ? pL : pL+pW, cx1 = direction==='lhs' ? cL+cW : cL, cx2 = direction==='lhs' ? cL+gap : cL+cW-gap;
    if (style==='straight') return `M ${px} ${py} L ${cx1} ${cy} H ${cx2}`;
    if (style==='elbow') return `M ${px} ${py} H ${(px+cx1)/2} V ${cy} H ${cx2}`;
    return wobble(`M ${px} ${py} C ${px} ${cy} ${cx1} ${cy} ${cx1} ${cy} H ${cx2}`, px+cy); };
  return { generateMainBranch: main, generateSubBranch: sub };
}

let stickersP = null;
function loadStickers(){
  if (window.MANAS_STICKERS) return Promise.resolve(window.MANAS_STICKERS);
  if (stickersP) return stickersP;
  stickersP = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'stickers.js';
    sc.onload = () => res(window.MANAS_STICKERS); sc.onerror = () => { stickersP = null; rej(new Error('stickers')); }; document.head.appendChild(sc); });
  return stickersP;
}
const stickerCache = {};
function stickerURI(hex){
  if (stickerCache[hex]) return stickerCache[hex];
  const lib = window.MANAS_STICKERS; if (!lib || !lib.svg[hex]) return '';
  return stickerCache[hex] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lib.svg[hex]);
}
function resolveImage(url){ return url && url.startsWith('sticker:') ? stickerURI(url.slice(8)) : url; }
const CATS = [ ['smileys-emotion','Faces'], ['people-body','People'], ['animals-nature','Nature'], ['food-drink','Food'], ['travel-places','Places'], ['objects','Things'], ['activities','Activities'], ['extras-openmoji','Health & work'], ['symbols','Symbols'] ];
const STOP = new Set(['the','a','an','and','or','of','to','in','on','for','with','my','our','your','is','are','be','it','this','that','at','by','from','as','do','how','what','new','idea','use']);
function suggestStickers(text, lib, limit=14){
  const words = (text||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w => w.length>2 && !STOP.has(w));
  const stems = words.map(w => w.replace(/(ing|ed|es|s)$/,'')).filter(w=>w.length>2);
  if (!stems.length) return [];
  const scored = [];
  for (const m of lib.meta){ const ann = m[1].toLowerCase(), kw = m[2]; let sc = 0;
    for (const w of stems){ if (ann === w || ann.split(' ').includes(w)) sc += 6; else if (ann.includes(w)) sc += 3; else if (new RegExp('(^|, )'+w).test(kw)) sc += 2; else if (kw.includes(w)) sc += 1; }
    if (sc) scored.push([sc, m]); }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.slice(0, limit).map(x=>x[1]);
}

function photoToNode(tpc, file){
  if (!file) return;
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 480; const r = Math.min(1, MAX/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', 0.82); const w = 160, h = Math.round(160 * c.height / c.width);
    setImage(tpc, { url:data, width:w, height:h }); toast('Photo added');
  };
  img.onerror = () => toast('That picture could not be read');
  img.src = url;
}

function drawSheet(tpc){
  const COLORS = ['#22203A','#E8743B','#F2A93B','#D9534F','#8E44AD','#1F6FB2','#2BB3A3','#3F8F4E','#FFFFFF'];
  let color = COLORS[0], size = 6, strokes = [], cur = null;
  sheet(`<h2>Draw it</h2><p class="sub">Use your finger. Keep it simple — small doodles read best.</p>
    <div class="pad-wrap"><canvas id="pad" width="600" height="600" aria-label="Drawing pad"></canvas></div>
    <div class="colors draw-colors">${COLORS.map(c=>`<button data-dc="${c}" style="background:${c};${c===color?'border-color:var(--accent)':''}${c==='#FFFFFF'?';outline:1px solid var(--line)':''}"></button>`).join('')}</div>
    <div class="row" style="align-items:center">
      <div class="chips"><button class="chip" data-sz="3">Thin</button><button class="chip on" data-sz="6">Medium</button><button class="chip" data-sz="12">Thick</button></div>
      <button class="btn" id="dr-undo" style="flex:0 0 auto">Undo</button><button class="btn" id="dr-clear" style="flex:0 0 auto">Clear</button>
    </div>
    <div class="row"><button class="btn" id="dr-cancel">Cancel</button><button class="btn primary" id="dr-ok">Use this drawing</button></div>`, s => {
      const cv = $('#pad',s), ctx = cv.getContext('2d');
      const redraw = () => { ctx.clearRect(0,0,cv.width,cv.height); for (const st of strokes.concat(cur?[cur]:[])){ ctx.strokeStyle = st.c; ctx.lineWidth = st.w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath();
        st.p.forEach((pt,i)=> i ? ctx.lineTo(pt[0],pt[1]) : ctx.moveTo(pt[0],pt[1])); if (st.p.length===1) ctx.lineTo(st.p[0][0]+0.1, st.p[0][1]); ctx.stroke(); } };
      const pos = e => { const r = cv.getBoundingClientRect(); return [ (e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height ]; };
      cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); cur = { c:color, w:size*2, p:[pos(e)] }; redraw(); e.preventDefault(); });
      cv.addEventListener('pointermove', e => { if (!cur) return; cur.p.push(pos(e)); redraw(); e.preventDefault(); });
      const end = () => { if (cur){ strokes.push(cur); cur=null; redraw(); } };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
      s.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { color = b.getAttribute('data-dc'); s.querySelectorAll('[data-dc]').forEach(x=>x.style.borderColor = x===b?'var(--accent)':''); });
      s.querySelectorAll('[data-sz]').forEach(b => b.onclick = () => { size = +b.getAttribute('data-sz'); s.querySelectorAll('[data-sz]').forEach(x=>x.classList.toggle('on', x===b)); });
      $('#dr-undo',s).onclick = () => { strokes.pop(); redraw(); };
      $('#dr-clear',s).onclick = () => { strokes = []; redraw(); };
      $('#dr-cancel',s).onclick = () => pictureSheet(tpc);
      $('#dr-ok',s).onclick = () => {
        if (!strokes.length){ toast('Draw something first'); return; }
        // crop to the drawn area with a margin, then shrink
        let x0=cv.width,y0=cv.height,x1=0,y1=0; for (const st of strokes) for (const p of st.p){ x0=Math.min(x0,p[0]-st.w); y0=Math.min(y0,p[1]-st.w); x1=Math.max(x1,p[0]+st.w); y1=Math.max(y1,p[1]+st.w); }
        x0=Math.max(0,x0); y0=Math.max(0,y0); x1=Math.min(cv.width,x1); y1=Math.min(cv.height,y1);
        const w=x1-x0, h=y1-y0, scale = Math.min(1, 240/Math.max(w,h));
        const out = document.createElement('canvas'); out.width=Math.round(w*scale); out.height=Math.round(h*scale);
        out.getContext('2d').drawImage(cv, x0,y0,w,h, 0,0,out.width,out.height);
        const dw = Math.min(120, out.width), dh = Math.round(dw*out.height/out.width);
        setImage(tpc, { url: out.toDataURL('image/png'), width:dw, height:dh }); toast('Drawing added');
      };
  });
}



/* ---------------- drag ring: pick up the thread and re-hook it ---------------- */
function removeGrab(){ document.querySelectorAll('.map-container .grab').forEach(g=>g.remove()); }
function placeGrab(){
  removeGrab();
  const sel = selected(); if (!sel || isRoot(sel) || !mind.editable) return;
  const g = document.createElement('span'); g.className = 'grab'; g.setAttribute('aria-label','Drag to move this idea');
  const main = sel.closest('me-main'); const down = !!sel.closest('me-nodes.down');
  g.classList.add(down ? 'top' : (main && main.classList.contains('lhs')) ? 'right' : 'left');
  sel.appendChild(g);
  g.addEventListener('pointerdown', startThreadDrag);
}
function startThreadDrag(e){
  e.stopPropagation(); e.preventDefault();
  const from = e.currentTarget.parentElement; if (!from || !from.nodeObj) return;
  const g = e.currentTarget; try { g.setPointerCapture(e.pointerId); } catch(err){}
  const ghost = document.createElement('div'); ghost.className = 'thread-ghost'; ghost.textContent = from.nodeObj.topic || 'idea'; document.body.appendChild(ghost);
  let target = null, mode = null, moved = false;
  const clearMark = () => { if (target) target.classList.remove('drop-in','drop-before','drop-after'); };
  const isDescendant = tpc => { let p = tpc.nodeObj; while (p){ if (p === from.nodeObj) return true; p = p.parent; } return false; };
  const onMove = ev => {
    moved = true; ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    const el = document.elementFromPoint(ev.clientX, ev.clientY); const tpc = el && el.closest ? el.closest('me-tpc') : null;
    clearMark(); target = null; mode = null;
    if (!tpc || tpc === from || isDescendant(tpc)) return;
    const r = tpc.getBoundingClientRect(); const y = (ev.clientY - r.top) / r.height;
    if (isRoot(tpc)) mode = 'in'; else mode = y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'in';
    target = tpc; tpc.classList.add('drop-' + mode);
  };
  const onEnd = async ev => {
    g.removeEventListener('pointermove', onMove); g.removeEventListener('pointerup', onEnd); g.removeEventListener('pointercancel', onEnd);
    ghost.remove(); const t = target, m = mode; clearMark();
    if (!moved || !t) { if (!moved) hint('Drag this ring onto another bubble'); return; }
    if (m === 'in') await mind.moveNodeIn([from], t); else if (m === 'before') await mind.moveNodeBefore([from], t); else await mind.moveNodeAfter([from], t);
    scheduleSave(); const again = MindElixir.E(from.nodeObj.id); if (again) mind.selectNode(again); renderDock();
    toast(m === 'in' ? 'Now under “' + (t.nodeObj.topic||'').slice(0,20) + '”' : 'Moved ' + m + ' “' + (t.nodeObj.topic||'').slice(0,20) + '”');
  };
  g.addEventListener('pointermove', onMove); g.addEventListener('pointerup', onEnd); g.addEventListener('pointercancel', onEnd);
}

function arrowLabelSheet(arrowSvg, onDone){

function startMerge(tpc){

function endMerge(){ mind.map.querySelectorAll('.merge-pick').forEach(x=>x.classList.remove('merge-pick')); mergeSet = null; mind.map.removeEventListener('click', onMergeClick, true); renderDock(); }
function onMergeClick(e){
  const t = e.target.closest && e.target.closest('me-tpc'); if (!t || !mergeSet) return;

/* drawing: numbered badges + dotted path */
function clearStory(){ mind.map.querySelectorAll('.story-badge').forEach(x => x.remove()); const p = mind.map.querySelector('.story-path'); if (p) p.remove(); }
function drawStory(st){
  clearStory(); if (!st) return;
  const mapRect = mind.map.getBoundingClientRect(), sc = mind.scaleVal || 1; const pts = [];
  st.steps.forEach((id, i) => {
    const el = MindElixir.E(id); if (!el) return;
    const b = document.createElement('span'); b.className = 'story-badge'; b.textContent = i + 1; el.appendChild(b);
    const r = el.getBoundingClientRect(); pts.push([ (r.left + r.width/2 - mapRect.left)/sc, (r.top - mapRect.top)/sc - 6 ]);
  });
  if (pts.length > 1){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','story-path');
    svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:15';
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    let d = ''; for (let i=0;i<pts.length;i++){ const [x,y] = pts[i]; if (!i) d += `M ${x} ${y}`; else { const [px,py] = pts[i-1]; const mx = (px+x)/2; d += ` C ${mx} ${py} ${mx} ${y} ${x} ${y}`; } }
    path.setAttribute('d', d); path.setAttribute('fill','none'); path.setAttribute('stroke','#F0A030'); path.setAttribute('stroke-width','3'); path.setAttribute('stroke-dasharray','2 8'); path.setAttribute('stroke-linecap','round');
    svg.appendChild(path); mind.map.appendChild(svg);
  }
}

  const prev = idx > 0 ? sibs[idx-1] : null, next = idx < sibs.length-1 ? sibs[idx+1] : null;

      <button id="mv-out" ${canOut?'':'disabled style="opacity:.4"'}>${ico('outdent')}<span>Move it out one level<br><small style="color:var(--muted)">Becomes a sibling of “${esc((parent&&parent.topic||'').slice(0,28))}”</small></span></button>

      const done = msg => { scheduleSave(); closeSheet(); renderDock(); toast(msg); };
      $('#mv-pick',s).onclick = () => { closeSheet(); pickTarget(tpc); };
      if (prev) $('#mv-in',s).onclick = async () => { await mind.moveNodeIn([tpc], tpcOf(prev)); done('Moved under “' + (prev.topic||'').slice(0,20) + '”'); };
      if (canOut) $('#mv-out',s).onclick = async () => { await mind.moveNodeAfter([tpc], tpcOf(parent)); done('Moved out one level'); };
      if (prev) $('#mv-up',s).onclick = async () => { await mind.moveUpNode(tpc); done('Moved up'); };
      if (next) $('#mv-down',s).onclick = async () => { await mind.moveDownNode(tpc); done('Moved down'); };
  });

let picking = null;
function pickTarget(tpc){
  picking = tpc; hint('Now tap the bubble it should go under');
  const bar = $('#dock'); bar.innerHTML = `<button class="act" id="a-cancelpick">${ico('check')}<span>Cancel</span></button>`;

function endPick(){ picking = null; mind.map.removeEventListener('click', onPickClick, true); renderDock(); }
async function onPickClick(e){
  const target = e.target.closest && e.target.closest('me-tpc'); if (!target || !picking) return;
  e.stopPropagation(); e.preventDefault();
  const from = picking;

}

function stampImage(blob){

      x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0);
      x.fillStyle = 'rgba(60,60,80,.75)'; x.font = '600 13px Outfit, system-ui, sans-serif'; x.textAlign = 'right';
      x.fillText('Made with Manas \u00b7 ' + COPYRIGHT, c.width - 12, img.height + 22);
      URL.revokeObjectURL(u); c.toBlob(b => res(b || blob), 'image/png'); };
    img.onerror = () => res(blob); img.src = u; });
}

/* ---------------- backup / restore ---------------- */
async function backupAll(){
  saveNow();
  const json = JSON.stringify({ app:'manas', version:1, copyright: COPYRIGHT, credits: CREDITS, exported:new Date().toISOString(), maps }, null, 1);
  const file = new File([json], 'manas-backup-' + new Date().toISOString().slice(0,10) + '.json', { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:'Manas backup' }); closeSheet(); return; } catch(e){ if (e.name==='AbortError') return; }
  }
  try { await navigator.clipboard.writeText(json); closeSheet(); toast('Backup copied — paste it somewhere safe'); }
  catch(e){ toast('Sharing is not available here'); }
}
function restoreFrom(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => restoreText(String(r.result));
  r.readAsText(file);
}
function restoreText(text){
  {
    try {
      const obj = JSON.parse(text); const incoming = Array.isArray(obj) ? obj : obj.maps;
      if (!Array.isArray(incoming)) throw 0;
      let added=0, updated=0;
      for (const m of incoming){ if (!m || !m.data || !m.data.nodeData) continue; const i = maps.findIndex(x=>x.id===m.id);

    <p class="sub">${first ? 'Pick a ready-made library to start with. Each one is a set of linked maps with lectures, key facts and flashcards. You can add or remove libraries later from the menu.' : 'Ready-made sets of linked maps. Add one with a tap; remove it when you no longer need it.'}</p>
    <div class="libs">${libs.map(row).join('')}</div>
    <div class="row" style="margin-top:14px">${first ? '<button class="btn" id="lb-skip">Just the app for now</button>' : '<button class="btn" id="lb-close">Done</button>'}</div>`, s => {
      const done = () => { if (first){ settings.libChosen = true; saveSettings(settings); closeSheet(); if (!settings.tourDone) setTimeout(startTour, 300); } else closeSheet(); };
      const sk = $('#lb-skip', s); if (sk) sk.onclick = done;
      const cl = $('#lb-close', s); if (cl) cl.onclick = done;
      s.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => { const e = libs.find(x => x.id === b.getAttribute('data-add')); b.disabled = true; b.textContent = 'Adding…';
        try { await installLibrary(e); } catch(err){ toast('Could not load that library — check the connection'); }
        if (first){ settings.libChosen = true; saveSettings(settings); closeSheet(); if (!settings.tourDone) setTimeout(startTour, 300); } else librariesSheet(false); });
      s.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { const e = libs.find(x => x.id === b.getAttribute('data-open')); closeSheet(); const r = maps.find(x => x.id === e.root) || maps.find(x => x.library === e.id); if (r) openMap(r.id, false); });
      s.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeLibrary(libs.find(x => x.id === b.getAttribute('data-rm'))));
  });
}

/* ---------------- study: flashcards with spaced repetition, and a quick quiz ---------------- */
const SRS_KEY = 'manas.srs.v1';
let srs = {}; try { srs = JSON.parse(localStorage.getItem(SRS_KEY) || '{}'); } catch(e){ srs = {}; }
let srsT; function saveSrs(){ clearTimeout(srsT); srsT = setTimeout(() => { try { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); } catch(e){} }, 300); }
const DAY = 86400000, INTERVALS = [0, 1, 2, 4, 8, 16, 32, 64];
const MEDIA = /^(🔊|🎬|📷|📖|📋|▶|🎥|🔗)/;
function plain(t){ return String(t || '').replace(/<[^>]+>/g, '').trim(); }
function cardsFrom(map, rootNode, seen, out){
  seen = seen || new Set(); out = out || []; if (!map || seen.has(map.id) || out.length > 5000) return out; seen.add(map.id);
  const start = rootNode || map.data.nodeData;
  walkNodes(start, (n, parent) => {
    const m = n.manas || {}; const topic = plain(n.topic);
    if (m.map){ const t = maps.find(x => x.id === m.map); if (t) cardsFrom(t, null, seen, out); return; }
    if (!topic || MEDIA.test(topic) || n === map.data.nodeData) return;
    const kids = (n.children || []).filter(c => !MEDIA.test(plain(c.topic)) && !(c.manas && c.manas.map));
    if (n.note && String(n.note).trim().length > 3) out.push({ id: map.id + ':' + n.id, front: m.q || topic, back: String(n.note), cue: topic, where: parent ? plain(parent.topic) : map.title, map: map.id, node: n.id });
    else if (kids.length >= 2 && kids.length <= 9) out.push({ id: map.id + ':' + n.id + ':k', front: `What comes under “${topic}”?`, back: kids.map(c => '• ' + plain(c.topic)).join('\n'), cue: topic, where: parent ? plain(parent.topic) : map.title, map: map.id, node: n.id });
  });
  return out;
}
function cardStats(cards){ const now = Date.now(); let due = 0, fresh = 0, known = 0; for (const c of cards){ const r = srs[c.id]; if (!r) fresh++; else { if (r.due <= now) due++; if (r.box >= 3) known++; } } return { due, fresh, known, total: cards.length }; }
function studySheet(map){
  if (!map) return; const whole = cardsFrom(map);
  if (!whole.length){ sheet(`<h2>Nothing to study yet</h2><p class="sub">Study makes flashcards from bubbles that have notes, and from bubbles with a few ideas under them. Add some ideas or notes, then come back.</p><div class="row"><button class="btn" id="st-x">OK</button></div>`, s => { $('#st-x', s).onclick = closeSheet; }); return; }
  const root = map.data.nodeData;
  const scopes = [{ label: 'Everything in this map', cards: whole }];
  for (const c of (root.children || [])){ if (MEDIA.test(plain(c.topic))) continue; const cs = (c.manas && c.manas.map) ? cardsFrom(maps.find(x => x.id === c.manas.map)) : cardsFrom(map, c, new Set()); if (cs.length) scopes.push({ label: plain(c.topic), cards: cs }); }
  const st = cardStats(whole);
  const line = sc => { const t = cardStats(sc.cards); return `${t.total} cards · ${t.known} known${t.due ? ` · <b>${t.due} due</b>` : ''}`; };
  sheet(`<h2>Study</h2><p class="sub">${esc(map.title || 'Untitled')} — ${st.total} cards, ${st.known} you know well${st.due ? `, ${st.due} due for review` : ''}. Manas brings back each card just before you would forget it.</p>
    <div class="menu" id="st-scopes">${scopes.slice(0, 40).map((sc, i) => `<button data-sc="${i}" class="${i ? '' : 'on'}">${ico(i ? 'branch' : 'cap')}<span>${esc(sc.label)}<br><small style="color:var(--muted)">${line(sc)}</small></span></button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="st-cards">Flashcards</button><button class="btn" id="st-quiz">Quiz me</button></div>`, s => {
      let pick = 0; s.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { pick = +b.getAttribute('data-sc'); s.querySelectorAll('[data-sc]').forEach(x => x.classList.toggle('on', x === b)); });
      $('#st-cards', s).onclick = () => { closeSheet(); startFlashcards(scopes[pick].cards, scopes[pick].label); };
      $('#st-quiz', s).onclick = () => { closeSheet(); startQuiz(scopes[pick].cards, scopes[pick].label); };
  });
}
function studyBox(){ let el = $('#study'); if (!el){ el = document.createElement('div'); el.id = 'study'; document.body.appendChild(el); } el.hidden = false; return el; }
function studyOpen(){ const el = $('#study'); return !!(el && !el.hidden); }
function endStudy(){ const el = $('#study'); if (el){ el.hidden = true; el.innerHTML = ''; } if (current && mind) setTimeout(applyDecor, 0); else renderHome(); }
function fmt(t){ return esc(t).replace(/\n/g, '<br>'); }
function startFlashcards(cards, label){
  const now = Date.now();
  const due = cards.filter(c => srs[c.id] && srs[c.id].due <= now).sort((a, b) => srs[a.id].due - srs[b.id].due);
  const fresh = cards.filter(c => !srs[c.id]);
  let queue = due.slice(0, 30).concat(fresh.slice(0, Math.max(10, 20 - due.length)));
  if (!queue.length){ const soon = cards.filter(c => srs[c.id]).sort((a, b) => srs[a.id].due - srs[b.id].due); queue = soon.slice(0, 15); }
  const total = queue.length; let doneN = 0, right = 0;
  const el = studyBox();
  const show = () => {
    const c = queue[0];
    if (!c){ el.innerHTML = `<div class="st-top"><button class="st-x" aria-label="Close">×</button><b>${esc(label)}</b><span></span></div><div class="st-card done"><div class="st-front">Well done</div><div class="st-back" style="display:block">${doneN} cards reviewed · ${right} known.<br>Come back ${nextDueText(cards)}.</div></div><div class="st-foot"><button class="btn primary" id="st-end">Finish</button></div>`; el.querySelector('.st-x').onclick = endStudy; $('#st-end', el).onclick = endStudy; return; }
    el.innerHTML = `<div class="st-top"><button class="st-x" aria-label="Close">×</button><b>${esc(label)}</b><span>${doneN + 1} / ${total}</span></div>
      <div class="st-bar"><i style="width:${Math.round(100 * doneN / Math.max(1, total))}%"></i></div>
      <div class="st-card"><small class="st-where">${esc(c.where || '')}</small><div class="st-front">${fmt(c.front)}</div><div class="st-back">${fmt(c.back)}</div></div>
      <div class="st-foot" id="st-f"><button class="btn primary wide" id="st-show">Show answer</button></div>`;
    el.querySelector('.st-x').onclick = endStudy;
    const reveal = () => { el.querySelector('.st-back').style.display = 'block'; $('#st-f', el).innerHTML = `<button class="btn" data-r="0">Didn't know</button><button class="btn" data-r="1">Almost</button><button class="btn primary" data-r="2">Knew it</button>`; el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(+b.getAttribute('data-r'))); };
    $('#st-show', el).onclick = reveal; el.querySelector('.st-card').onclick = () => { if (el.querySelector('.st-back').style.display !== 'block') reveal(); };
  };
  const rate = r => {
    const c = queue.shift(); const rec = srs[c.id] || { box: 0, due: 0, seen: 0 };
    rec.seen++; if (r === 0){ rec.box = 0; rec.due = Date.now() + 60000; if (queue.length > 2) queue.splice(3, 0, c); else queue.push(c); }
    else { rec.box = Math.min(INTERVALS.length - 1, r === 2 ? rec.box + 1 : Math.max(1, rec.box)); rec.due = Date.now() + INTERVALS[rec.box] * DAY * (r === 1 ? 0.6 : 1) + (rec.box ? 0 : 600000); doneN++; if (r === 2) right++; }
    srs[c.id] = rec; saveSrs(); show();
  };
  show();
}
function nextDueText(cards){ const t = cards.map(c => srs[c.id] && srs[c.id].due).filter(Boolean).sort((a, b) => a - b).find(d => d > Date.now()); if (!t) return 'any time to learn new cards'; const d = Math.round((t - Date.now()) / DAY); return d <= 0 ? 'later today for the next review' : d === 1 ? 'tomorrow for the next review' : `in ${d} days for the next review`; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(cards, label){
  const pool = cards.filter(c => c.back && c.back.length < 240 && !c.id.endsWith(':k'));
  if (pool.length < 4){ toast('Not enough cards for a quiz here — try Flashcards'); return; }
  const qs = shuffle(pool.slice()).slice(0, 10).map(c => {
    const near = pool.filter(x => x !== c && x.where === c.where && x.back !== c.back); const far = pool.filter(x => x !== c && x.where !== c.where && x.back !== c.back);
    const wrong = shuffle(near.slice()).concat(shuffle(far.slice())).slice(0, 3);
    return { c, opts: shuffle([c].concat(wrong)) };
  });
  let i = 0, score = 0; const el = studyBox();
  const show = () => {
    const q = qs[i];
    if (!q){ el.innerHTML = `<div class="st-top"><button class="st-x" aria-label="Close">×</button><b>${esc(label)}</b><span></span></div><div class="st-card done"><div class="st-front">${score} / ${qs.length}</div><div class="st-back" style="display:block">${score === qs.length ? 'Perfect.' : score >= qs.length * 0.7 ? 'Good work.' : 'The ones you missed will come back in your flashcards.'}</div></div><div class="st-foot"><button class="btn" id="st-again">Another quiz</button><button class="btn primary" id="st-end">Finish</button></div>`; el.querySelector('.st-x').onclick = endStudy; $('#st-end', el).onclick = endStudy; $('#st-again', el).onclick = () => startQuiz(cards, label); return; }
    el.innerHTML = `<div class="st-top"><button class="st-x" aria-label="Close">×</button><b>${esc(label)}</b><span>${i + 1} / ${qs.length}</span></div>
      <div class="st-bar"><i style="width:${Math.round(100 * i / qs.length)}%"></i></div>
      <div class="st-card q"><small class="st-where">${esc(q.c.where || '')}</small><div class="st-front">${fmt(q.c.front)}</div></div>
      <div class="st-opts">${q.opts.map((o, k) => `<button class="st-opt" data-k="${k}">${fmt(o.back)}</button>`).join('')}</div>
      <div class="st-foot" id="st-f"></div>`;
    el.querySelector('.st-x').onclick = endStudy;
    el.querySelectorAll('.st-opt').forEach(b => b.onclick = () => {
      if (el.querySelector('.st-opt.ok')) return; const pickd = q.opts[+b.getAttribute('data-k')]; const good = pickd === q.c;
      el.querySelectorAll('.st-opt').forEach((x, k) => { if (q.opts[k] === q.c) x.classList.add('ok'); }); if (!good) b.classList.add('bad');
      if (good) score++; else { srs[q.c.id] = { box: 0, due: Date.now(), seen: ((srs[q.c.id] || {}).seen || 0) + 1 }; saveSrs(); }
      $('#st-f', el).innerHTML = `<button class="btn primary wide" id="st-next">${i < qs.length - 1 ? 'Next' : 'See score'}</button>`; $('#st-next', el).onclick = () => { i++; show(); };
    });
  };
  show();
}

/* ---------------- lifecycle ---------------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('resize', () => { if (mind) setTimeout(()=>{ try{ mind.toCenter(); }catch(e){} }, 100); });
async function preload(){
  // a page can ship a preload.json next to it: {maps:[...]} — those maps are added once, then opened
  const tag = document.querySelector('meta[name="manas-preload"]'); if (!tag) return null;
  const src = tag.getAttribute('content') || 'preload.json';
  const readText = () => new Promise((res, rej) => {
    if (location.protocol === 'file:'){ const x = new XMLHttpRequest(); x.open('GET', src); x.onload = () => (x.status === 0 || x.status === 200) ? res(x.responseText) : rej(x.status); x.onerror = rej; x.send(); }
    else fetch(src, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(res, rej);
  });
  try {
    const j = JSON.parse(await readText()); const list = Array.isArray(j) ? j : (j && j.maps) || []; let first = null; preloadList = list.filter(m => m && m.data && m.data.nodeData);
    for (const m of list){ if (!m || !m.data || !m.data.nodeData) continue; const have = maps.find(x => x.id === m.id);
      if (!have){ maps.unshift(m); saveMap(m); if (!first) first = m; } else if ((m.updated||0) > (have.updated||0) && !have.touched){ Object.assign(have, m); saveMap(have); } }
    DIAG.preload = first ? 'added' : 'already present';
    return first || (list[0] && maps.find(x => x.id === list[0].id)) || null;
  } catch(e){ DIAG.preload = 'failed: ' + (e && (e.message || e)); return null; }
}
async function boot(){
  try {
    await idb.open(); maps = await idb.all(); DIAG.storage = 'IndexedDB';
    const pre = await preload();
    if (!maps.length){
      let legacy = []; try { legacy = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch(e){}
      if (legacy.length){ maps = legacy; saveMaps(maps); }
    }
    // the guide map is seeded once on every device, even when a page ships its own preloaded map
    if ((!maps.length || !settings.guideSeeded) && !maps.some(m => m.title === GUIDE_TITLE)){ const sm = sampleMap(); if (preloadList.length){ sm.created = sm.updated = Date.now() - 86400000; } maps.push(sm); saveMap(sm); settings.guideSeeded = true; saveSettings(settings); }
    if (CATALOG_SRC && !pre){ await loadCatalog(); if (catalog && !settings.libChosen){ renderHome(); setTimeout(() => librariesSheet(true), 300); return; } }
    if (!settings.tourDone){ renderHome(); if (pre) { settings.preloadOpened = true; saveSettings(settings); } setTimeout(startTour, 400); return; }
    if (pre && !settings.preloadOpened){ settings.preloadOpened = true; saveSettings(settings); renderHome(); openMap(pre.id, false); return; }
  } catch(e){
    try { maps = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch(e2){ maps = []; }
    if (!maps.length) maps = [sampleMap()];
    DIAG.storage = 'memory only'; toast('Storage is limited in this browser');
  }
  renderHome();
}
const DIAG = { version: '6.4', catalog: 'none', preload: 'not tried', storage: 'unknown', bridge: false, imports: 0, lastError: '' };
window.addEventListener('error', e => { DIAG.lastError = String(e.message || e).slice(0, 200); });
function pollBridge(){
  try {
    const b = window.ManasBridge; if (!b) return; DIAG.bridge = true;
    const t = b.takeImport && b.takeImport(); if (t && t.length > 2){ DIAG.imports++; restoreText(String(t)); }
  } catch(e){ DIAG.lastError = 'bridge: ' + e; }
}
setInterval(pollBridge, 1200); document.addEventListener('visibilitychange', () => { if (!document.hidden) pollBridge(); });
const FEEDBACK_EMAIL = 'kewal@halcyonhealthcareltd.com';
function feedbackSheet(){
  sheet(`<h2>Send feedback</h2><p class="sub">What annoyed you, what you wished it did, what broke. Short is fine.</p>
    <textarea class="field" id="fb-in" rows="5" placeholder="e.g. Couldn't find how to move a bubble"></textarea>
    <div class="row"><button class="btn" id="fb-no">Cancel</button><button class="btn primary" id="fb-ok">Send by email</button></div>`, s => {
      $('#fb-no',s).onclick = closeSheet;
      $('#fb-ok',s).onclick = () => { const body = ($('#fb-in',s).value.trim() || '(no text)') + '\n\n— Manas ' + DIAG.version + ' · ' + (location.protocol === 'file:' ? 'installed app' : 'web') + ' · ' + navigator.userAgent.slice(0, 80);
        location.href = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + encodeURIComponent('Manas feedback') + '&body=' + encodeURIComponent(body); closeSheet(); };
  });
}
function confirmExternal(href, then){

  const yt = /youtube\.com|youtu\.be/.test(host);

    <div class="row"><button class="btn" id="ex-no">Stay</button><button class="btn primary" id="ex-ok">${yt ? 'Open YouTube' : 'Open'}</button></div>`, s => {
      $('#ex-no',s).onclick = closeSheet; $('#ex-ok',s).onclick = () => { closeSheet(); then(); };
  });
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
  const href = a.getAttribute('href') || ''; if (!/^https?:/i.test(href)) return;

function aboutSheet(){
  sheet(`<h2>About Manas</h2><p class="sub">Version ${DIAG.version} · ${location.protocol === 'file:' ? 'installed app' : 'web'}</p>
    <p class="tips" style="margin:0 0 12px;font-size:12px">${esc(COPYRIGHT)} Engine: Mind Elixir (MIT). Cartoons: OpenMoji (CC BY-SA 4.0).</p>
    <div class="tips"><li>Maps on this device: <b>${maps.length}</b></li><li>Storage: <b>${DIAG.storage}</b></li><li>Bundled map: <b>${DIAG.preload}</b></li><li>Share-to-Manas bridge: <b>${DIAG.bridge ? 'present' : 'absent'}</b> · imports received: ${DIAG.imports}</li><li>AI: <b>${ai ? 'available' : 'not here'}</b></li>${DIAG.lastError ? `<li>Last error: <code>${esc(DIAG.lastError)}</code></li>` : ''}</div>
    <p class="tips" style="margin-top:12px">To bring a map in on the installed app: open the backup file in Files or Drive, tap Share, choose Manas.</p>
    <div class="row"><button class="btn primary" id="ab-ok">Close</button></div>`, s => { $('#ab-ok',s).onclick = closeSheet; });
}
window.__manas_dev = { restoreText, openMap, goHome, maps: () => maps, orbit: O, countNodes, mind: () => mind };
window.manasBack = function(){
  try {
    if (studyOpen()){ endStudy(); return 'ok'; }
    if (!wrap.hidden){ closeSheet(); return 'ok'; }
    if (!orbitEl.hidden){ O.back(); return 'ok'; }
    if (!editorEl.hidden){ if (storyEdit) endStoryEdit(); else if (storyPlay) endStoryPlay(); else if (picking) endPick(); else if (connectFrom) endConnect(); else if (mergeSet) endMerge(); else if (mapStack.length) backOrHome(); else goHome(true); return 'ok'; }

};
boot();
})();
