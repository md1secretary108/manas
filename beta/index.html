<style>
:root{
  --manas-origin:'KKD-MANAS-NBO-20260914-7c3e';
  --ink:#22203A; --paper:#FAF8FF; --surface:#FFFFFF; --muted:#68657F; --line:#E4E1F0;
  --accent:#F0A030; --accent-ink:#2A1B00; --teal:#2BB3A3; --danger:#D9534F;
  --shadow:0 8px 28px rgba(34,32,58,.12); --bar:rgba(255,255,255,.92);
  --radius:18px;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ECE9F7; --paper:#16152A; --surface:#221F3A; --muted:#A39FBF; --line:#332F52;
    --shadow:0 8px 28px rgba(0,0,0,.45); --bar:rgba(34,31,58,.94); --hl:rgba(240,160,48,.22); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ECE9F7; --paper:#16152A; --surface:#221F3A; --muted:#A39FBF; --line:#332F52;
  --shadow:0 8px 28px rgba(0,0,0,.45); --bar:rgba(34,31,58,.94); --hl:rgba(240,160,48,.22); color-scheme:dark;
}
:root[data-look="horizon"]{   /* 21 Nov 2026: Horizon — the night-sky look. Tokens only, so every screen follows; no blur or animation (cheap phones). */
  --ink:#ECE9F7; --paper:#0B0A18; --surface:#17152E; --muted:#A9A5C6; --line:#2C2950;
  --shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(143,124,255,.06); --bar:rgba(20,18,44,.96); --hl:rgba(240,160,48,.24); color-scheme:dark;
}
html[data-look="horizon"] body{background-color:var(--paper);background-image:radial-gradient(900px 520px at 85% -8%,rgba(143,124,255,.20),transparent 62%),radial-gradient(700px 480px at -12% 108%,rgba(240,160,48,.10),transparent 60%);background-attachment:fixed}
html[data-look="horizon"] .new-map{background:linear-gradient(135deg,#2A2258,#1A1638 60%,#2A1E1A);color:var(--ink);border:1px solid rgba(240,160,48,.35);box-shadow:0 0 0 1px rgba(240,160,48,.08),0 14px 34px -12px rgba(240,160,48,.35)}
html[data-look="horizon"] .new-map .plus{box-shadow:0 0 18px rgba(240,160,48,.55)}
html[data-look="horizon"] :is(.card,.shelf-card,.lib-row,.recent-chip,.sheet){border-color:var(--line);background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--font-ui);margin:0;text-wrap:balance;line-height:1.15}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.screen[hidden]{display:none}

/* ---------- HOME ---------- */
#home{overflow:auto;-webkit-overflow-scrolling:touch}
.home-inner{width:100%;max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px 120px}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:28px;padding-bottom:12px}
.brand{font-family:var(--font-ui);font-weight:700;font-size:30px;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}

/* guided tour */
#tour{position:fixed;inset:0;z-index:60}
.art{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .5s ease;pointer-events:none;z-index:0}
#map-art.on{opacity:.26}html[data-theme=dark] #map-art.on{opacity:.55}@media(prefers-color-scheme:dark){html:not([data-theme=light]) #map-art.on{opacity:.55}}
#editor.has-art .map-container,#editor.has-art map-container{background-color:transparent!important}
#map-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--paper) 0%,transparent 22%,transparent 70%,var(--paper) 100%);opacity:.7}
#o-art{filter:blur(3px) saturate(1.1);transform:scale(1.04)}
#o-art.on{opacity:.42}
#o-art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,10,24,.15),rgba(11,10,24,.75))}
@media (prefers-reduced-motion: reduce){.art{transition:none}}
#gate{position:fixed;inset:0;z-index:95;background:var(--paper);color:var(--ink);overflow:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}#gate .gate-card{width:100%;max-width:460px;margin:auto 0}#gate .gate-logo{font-family:var(--font-ui);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}#gate h2{font-size:26px;margin:0 0 6px}#gate .menu{display:flex;flex-direction:column}
#tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,18,40,.62);transition:all .35s ease;pointer-events:none}
#tour .tcard{position:absolute;left:16px;right:16px;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 16px 12px;box-shadow:0 12px 40px rgba(0,0,0,.28);font-family:inherit}
#tour .tcard h3{font-size:17px;font-weight:700;margin:0 0 4px}
#tour .tcard p{font-size:14.5px;line-height:1.4;color:var(--muted);margin:0 0 12px}
#tour .tcard .row{display:flex;gap:8px;align-items:center}
#tour .tcard .step{font-size:12.5px;color:var(--muted);margin-right:auto}
#tour .tcard .btn{padding:9px 16px;font-size:14px}
mark{background:rgba(255,196,80,.55);color:inherit;border-radius:3px;padding:0 1px}
.menu button span{min-width:0;overflow:hidden}
.portal{width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.portal svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.portal.lost{background:var(--danger)}
.portal.addable{background:transparent;color:var(--ink);border:2px dashed var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.chip{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.thread{display:flex;flex-direction:column;gap:6px}.thread-map{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}.thread-row{display:flex;align-items:center;gap:8px}.thread-go{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}.thread-go b{font-size:12px;color:var(--muted)}.thread-go span{font-size:14px;font-weight:600}

me-tpc.has-portal{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink)}
#back-btn.stacked{background:var(--ink);color:var(--paper)}

/* study */
#study{position:fixed;inset:0;z-index:70;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:12px}
#study .st-top{display:flex;align-items:center;gap:10px}
#study .st-top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#study .st-top span{font-size:13px;color:var(--muted)}
#study .st-x{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:24px;line-height:1;color:var(--ink)}
#study .st-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
#study .st-bar i{display:block;height:100%;background:var(--accent,#E8743B);transition:width .3s}
#study .st-card{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#study .st-card.q{flex:0 0 auto;min-height:120px}
#study .st-where{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#study .st-front{font-size:21px;font-weight:700;line-height:1.3}
#study .st-back{display:none;font-size:17px;line-height:1.45;border-top:1px dashed var(--line);padding-top:14px;white-space:normal}
#study .st-card.done{align-items:center;text-align:center}
#study .st-card.done .st-front{font-size:34px}
#study .st-foot{display:flex;gap:8px}
#study .st-foot .btn{flex:1;padding:14px 8px;font-size:15px}
#study .st-opts{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
#study .st-opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.35;color:var(--ink)}
#study .st-opt.ok{border-color:#2BB3A3;background:rgba(43,179,163,.14)}
#study .st-opt.bad{border-color:var(--danger);background:rgba(217,83,79,.12)}
#study[hidden]{display:none!important}
.menu button.on{outline:2px solid var(--ink);outline-offset:-2px}
/* libraries */
.libs{display:flex;flex-direction:column;gap:10px}
.lib-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.lib-row.on{border-color:var(--ink)}
.lib-row.locked .lib-ico{opacity:.55}
.lib-ico{font-size:28px;width:40px;text-align:center;flex:none}
.lib-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lib-txt b{font-size:15.5px}
.lib-txt small{font-size:12.5px;color:var(--muted);line-height:1.3}
.lib-txt .lib-meta{font-size:11.5px;opacity:.85}
.btn.small{padding:8px 12px;font-size:13.5px;flex:none}
.btn.small.ghost{background:transparent;border:1px solid var(--line)}
.btn svg{width:20px;height:20px;flex:none}#sheet h2 svg{width:24px;height:24px;vertical-align:-4px;margin-right:4px}.btn.small svg{width:16px;height:16px}
#home-banner{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.banner{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.35}
.banner span{flex:1}
.banner.up{border-color:var(--accent)}
#study .st-report{align-self:flex-end;background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:4px}
.icon-btn.small{width:38px;height:38px}.icon-btn.small svg{width:19px;height:19px}
.topbar .title-btn{font-size:15px;padding:8px 8px}
.new-map{margin-top:16px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:var(--radius);background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.new-map .plus{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.new-map .plus svg{width:26px;height:26px}
.new-map b{font-family:var(--font-ui);font-size:19px;font-weight:600;display:block}
.new-map span{font-size:14px;opacity:.75}
.new-map:active{transform:scale(.985)}
.new-map.alt{margin-top:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.new-map.alt .plus{background:#1C7D71;color:#fff}
.new-map.alt span span{color:var(--muted);opacity:1}
.pick{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;font-size:15px;text-align:left;width:100%}
.pick .tick{position:static;flex:none}
.pick:active{background:var(--line)}
.section-label{margin:28px 0 10px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:150px}
.card:active{transform:scale(.97)}
.card .preview{height:64px;border-radius:12px;position:relative;overflow:hidden}
.card .preview i{position:absolute;display:block;height:4px;border-radius:2px;opacity:.9}
.card .preview b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.card h3{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.card .more{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);color:#22203A}
.card .more svg{width:18px;height:18px}
.empty{padding:30px 10px;color:var(--muted);text-align:center}
.home-copyright{margin:40px 0 0;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

/* ---------- EDITOR ---------- */
#editor{background:var(--paper)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(var(--bar),rgba(255,255,255,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.title-btn{flex:1;min-width:0;text-align:left;font-family:var(--font-ui);font-weight:600;font-size:17px;padding:8px 10px;border-radius:12px;background:var(--bar);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}
.tb{background:var(--bar);backdrop-filter:blur(8px)}
#map{position:absolute!important;inset:0;width:100%;height:100%!important}
.map-container .selected{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.map-container me-root me-tpc{font-family:var(--font-ui);font-weight:600}
.map-container me-tpc{font-family:var(--font-body)}
.map-container #input-box{font-size:16px}

.map-container me-tpc .grab{pointer-events:auto;position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent, #F0A030);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);top:50%;transform:translate(-50%,-50%);z-index:60;touch-action:none;cursor:grab;display:grid;place-items:center}
.map-container me-tpc .grab::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.map-container me-tpc .grab::after{content:'';position:absolute;inset:-14px}
.map-container me-tpc .grab.left{left:0}.map-container me-tpc .grab.right{left:100%}.map-container me-tpc .grab.top{left:50%;top:0}
.map-container me-tpc.drop-in{outline:3px dashed var(--accent,#F0A030)!important;outline-offset:3px;border-radius:8px}
.map-container me-tpc.drop-before{box-shadow:0 -6px 0 -2px var(--accent,#F0A030)}
.map-container me-tpc.drop-after{box-shadow:0 6px 0 -2px var(--accent,#F0A030)}
.thread-ghost{position:fixed;z-index:500;pointer-events:none;transform:translate(-50%,-50%);padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-family:var(--font-ui);font-weight:600;font-size:14px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow)}
/* shapes */
.map-container me-parent me-tpc{transition:border-radius .25s,transform .25s,box-shadow .25s}
.map-container me-tpc[data-shape="pill"]{border-radius:999px!important;padding-left:16px!important;padding-right:16px!important}
.map-container me-tpc[data-shape="box"]{border-radius:4px!important}
.map-container me-tpc[data-shape="circle"]{border-radius:50%!important;aspect-ratio:1;display:flex!important;align-items:center;justify-content:center;text-align:center;padding:14px!important;min-width:3.2em}
.map-container me-tpc[data-shape="cloud"]{border-radius:55% 45% 50% 50% / 60% 55% 45% 40%!important;padding:12px 20px!important}
.map-container me-tpc[data-shape="note"]{border-radius:2px!important;background:#FFF3B0!important;color:#22203A!important;transform:rotate(-1.5deg);box-shadow:2px 3px 8px rgba(0,0,0,.18);padding:10px 14px!important;border-color:transparent!important}
.map-container me-tpc[data-shape="under"]{border-radius:0!important;background:transparent!important;border:0!important;border-bottom:3px solid var(--main-color)!important;padding-left:4px!important;padding-right:4px!important}
.map-container me-parent me-tpc[data-shape]:not([data-shape="under"]):not([data-shape="note"]){border:2px solid var(--main-color);background-color:var(--main-bgcolor)}
/* live content on the bubble */
.map-container me-tpc .mx{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin:0 4px;pointer-events:none}
.map-container me-tpc .mx .tick,.map-container me-tpc .mx .portal{pointer-events:auto}
.map-container me-tpc.done>.text{text-decoration:line-through;opacity:.6}
.tick{width:20px;height:20px;border-radius:6px;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:13px;font-weight:800;line-height:1;opacity:.75;flex:none;transition:transform .15s,background .15s}
.tick.on{background:#1C7D71;border-color:#1C7D71;color:#fff;opacity:1}
.tick:active{transform:scale(.85)}
.ring{--p:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(#2BB3A3 calc(var(--p)*1%),rgba(120,120,140,.22) 0);display:inline-grid;place-items:center;position:relative;flex:none}
.ring i{position:absolute;inset:4px;border-radius:50%;background:var(--main-bgcolor,#fff)}
.ring b{position:relative;font-size:8px;font-weight:800;line-height:1}
.due{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(120,120,140,.15);white-space:nowrap}
.due.soon{background:#FDE2B3;color:#7A4A00}.due.late{background:#FFB7B2;color:#7A1E1A}
.menu-count{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#D93B3B;color:#fff;font:800 11px/18px system-ui,sans-serif;text-align:center;pointer-events:none}
#home-menu-btn{position:relative}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#F0A030;color:#2A1B00;font-size:11px;font-weight:800;display:inline-grid;place-items:center;line-height:1}
/* lines */
.map-container.line-thin .lines path{stroke-width:1.5}.map-container.line-thin .subLines path{stroke-width:1.2}
.map-container.line-bold .lines path{stroke-width:5}.map-container.line-bold .subLines path{stroke-width:3.2}
.map-container .lines path,.map-container .subLines path{stroke-linecap:round;stroke-linejoin:round}
.map-container me-tpc.merge-pick{outline:3px solid #2BB3A3;outline-offset:2px;border-radius:6px}
.map-container .topiclinks path[stroke]{pointer-events:stroke}
.map-container me-tpc .story-badge{position:absolute;top:-12px;left:-12px;width:24px;height:24px;border-radius:50%;background:#F0A030;color:#2A1B00;font-family:var(--font-ui);font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;pointer-events:none;z-index:20}
.story-cap{position:absolute;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:29;background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.story-cap b{display:block;font-family:var(--font-ui);font-size:17px;line-height:1.2}
.story-cap span{display:block;font-size:14px;color:var(--muted);margin-top:4px;max-height:5.6em;overflow:auto}
.steps{margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.5;max-height:32dvh;overflow:auto}
/* movement and feel */
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.07)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes wiggle{0%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-50%) rotate(3deg)}100%{transform:translate(-50%,-50%) rotate(-3deg)}}
.map-container me-tpc.fresh{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.map-container me-tpc.selected{animation:bounce .3s ease-out}
.map-container me-tpc[data-shape="note"].selected{animation:none}
.thread-ghost{animation:wiggle .6s ease-in-out infinite}
/* motion (2D), beta: all under html.mo, so Calm removes every rule at once */
#map-glow{display:none}   /* kept empty: the backdrop is now drawn behind the bubbles (below), not over them, so it never tints a bubble or a mark */
html.mo #map .map-container{isolation:isolate}
html.mo #map .map-container::before{content:"";position:absolute;top:-18%;right:-18%;bottom:-18%;left:-18%;z-index:-1;pointer-events:none;opacity:.6;will-change:transform;animation:mo-drift 20s ease-in-out infinite alternate;
  background:radial-gradient(36% 28% at 20% 22%,rgba(126,156,255,.30),transparent 70%),radial-gradient(32% 26% at 82% 28%,rgba(240,98,146,.22),transparent 70%),radial-gradient(38% 30% at 26% 80%,rgba(43,179,163,.22),transparent 70%),radial-gradient(34% 28% at 80% 78%,rgba(240,160,48,.24),transparent 70%)}
html.mo[data-theme=dark] #map .map-container::before{opacity:.85}@media(prefers-color-scheme:dark){html.mo:not([data-theme=light]) #map .map-container::before{opacity:.85}}
html.mo-lite #map .map-container::before{animation:none}html.mo-lite .map-container me-root>me-tpc::after{display:none}
html.mo .map-container me-tpc.mo-pre{opacity:0}
@keyframes mo-drift{from{transform:translate(-3%,-2%) rotate(0deg)}to{transform:translate(3%,2%) rotate(5deg)}}
@keyframes mo-pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mo-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes mo-flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes mo-rip{from{transform:scale(1);opacity:.75}to{transform:scale(1.5,1.9);opacity:0}}
@keyframes mo-halo{from{transform:scale(1);opacity:.6}to{transform:scale(1.22,1.6);opacity:0}}
@keyframes mo-spark{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@keyframes mo-fall{to{transform:translateY(110dvh) rotate(540deg);opacity:.9}}
html.mo .map-container me-tpc.mo-in{animation:mo-pop .5s cubic-bezier(.34,1.56,.64,1) both}
html.mo .map-container path.mo-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:mo-draw .6s ease-out both}
.map-container path.mo-flow{display:none}
html.mo .map-container path.mo-flow{display:inline;pointer-events:none;stroke-dashoffset:1;animation:mo-flow 2.6s linear infinite;filter:drop-shadow(0 0 3px #fff)}
html.mo .map-container me-tpc .mo-rip{position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--accent,#F0A030);pointer-events:none;animation:mo-rip .6s ease-out forwards}
html.mo .map-container me-root>me-tpc::after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:2px solid var(--accent,#F0A030);pointer-events:none;animation:mo-halo 2.8s ease-out infinite}
html.mo .map-container me-main>me-wrapper>me-parent>me-tpc{box-shadow:0 6px 16px rgba(20,18,43,.14)}
html.mo .map-container me-root>me-tpc{position:relative;box-shadow:0 8px 22px rgba(20,18,43,.2)}
html.mo .mo-spark{position:absolute;z-index:40;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:mo-spark .75s ease-out forwards}
html.mo .mo-bit{position:absolute;z-index:40;top:-16px;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:mo-fall 1.8s ease-in forwards}
.grab{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
/* soft bubbles + blended colours, beta 12: all under html.soft, so Settings → Bubbles → Classic removes every rule at once.
   Padding and border width are untouched (bubbles keep their size). Fixed colours only, set by softBlend() (no color-mix: old Android WebViews). Bubbles with a chosen shape keep that shape. */
html.soft .map-container me-parent me-tpc:not([data-shape]){border-radius:9px}
html.soft .map-container me-main>me-wrapper>me-parent>me-tpc:not([data-shape]){border-radius:18px}
html.soft .map-container me-root>me-tpc:not([data-shape]){border-radius:26px}
html.soft .map-container me-root>me-tpc:not([data-shape]):not(.has-portal){box-shadow:0 10px 24px -12px var(--root-bgcolor)}
html.soft .map-container me-main>me-wrapper>me-parent>me-tpc.bl:not([data-shape]){border-color:transparent!important;background:linear-gradient(135deg,var(--bcA),var(--bc2A)) padding-box,linear-gradient(var(--main-bgcolor),var(--main-bgcolor)) padding-box,linear-gradient(135deg,var(--bc),var(--bc2)) border-box}
html.soft .map-container me-main>me-wrapper>me-parent>me-tpc.bl:not([data-shape]):not(.has-portal):not(.drop-before):not(.drop-after){box-shadow:0 6px 16px -8px var(--bcG)}
html.soft[data-look="horizon"] .map-container me-main>me-wrapper>me-parent>me-tpc.bl:not([data-shape]):not(.has-portal):not(.drop-before):not(.drop-after){box-shadow:0 0 16px -3px var(--bcG)}

/* easy reading on a phone, beta 13: all under html.easy, so Settings → Phone reading → Classic removes every rule at once. Library maps on a phone only (#map.ez, set when a map opens; not for a volunteer on a task or a reviewer). */

/* ---------- SHEETS ---------- */
/* 7.20 guided lesson */
#lesson{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
#lesson[hidden]{display:none}
#lesson button{font:600 15px var(--font-ui);border-radius:14px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
#lesson button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#lesson button:disabled{opacity:.4}
.ls-top{display:flex;align-items:center;gap:8px;justify-content:space-between;max-width:640px;width:100%;margin:0 auto}
.ls-count{color:var(--muted);font-size:14px}
.ls-dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.ls-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.ls-dots i.done{background:var(--teal)}.ls-dots i.on{background:var(--accent);transform:scale(1.3)}
.ls-body{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:8px 2px 16px}
.ls-crumb{color:var(--muted);font-size:14px;text-align:center}
.ls-icon{font-size:64px;text-align:center;line-height:1.2;margin:10px 0 4px}
.ls-title{font-size:26px;font-weight:700;text-align:center;margin:0 0 12px}
.ls-note{font-size:20px;line-height:1.6;margin:0 0 12px}
.ls-list{font-size:18px;line-height:1.55;padding-left:22px;margin:0 0 12px}.ls-list li{margin:0 0 10px}
.ls-list details{margin-top:4px;color:var(--muted)}.ls-list summary{color:var(--teal);font-weight:600;cursor:pointer;min-height:32px}
.ls-src{color:var(--muted);font-size:13px}
.ls-hint{color:var(--muted);font-size:15px;line-height:1.5;margin:4px 0 10px}
.ls-ticks{list-style:none;padding-left:0}.ls-ticks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 4px;border-radius:10px}
.ls-ticks input{width:26px;height:26px;flex:0 0 26px;margin-top:2px;accent-color:var(--teal)}.ls-ticks input:checked+span{color:var(--muted);text-decoration:line-through}
.ls-alldone{font-size:18px;font-weight:600;color:var(--teal);text-align:center}.ls-alldone[hidden]{display:none}
.ls-qdots{display:flex;gap:8px;justify-content:center;margin:0 0 8px}.ls-qdots i{font-style:normal;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line);color:var(--muted)}
.ls-qdots i.known{background:var(--teal);color:#fff;border-color:var(--teal)}.ls-qdots i.on{outline:3px solid var(--accent);outline-offset:1px}
.ls-qn{color:var(--muted);font-size:15px;text-align:center;margin:0 0 6px}.ls-q{font-size:22px;font-weight:700;line-height:1.5;margin:0 0 14px}
.ls-ans{font-size:19px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.ls-judge{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 10px}.ls-judge button{flex:1 1 140px}
.ls-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;width:100%;margin:0 auto}
.ls-bar #ls-next{flex:1 1 140px}
.ls-pic{margin:8px auto 6px;text-align:center}.ls-pic img{width:112px;height:112px;display:block;margin:0 auto}.ls-pic figcaption{color:var(--muted);font-size:15px;margin-top:2px}
.ls-help{text-align:center;margin:6px 0 10px}.ls-help button{font-weight:600}
.ls-order{text-align:center}
.ls-cardbody{display:flex;flex-direction:column;justify-content:center}.ls-cardbody .ls-note{text-align:center}.ls-cardbtns{flex-direction:column;align-items:stretch;max-width:420px;width:100%;margin:8px auto}.ls-cardbtns button{flex:0 0 auto}
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,18,40,.45)}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:85dvh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:4px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:14px;padding:14px 8px;border-radius:12px;font-size:16px;text-align:left;width:100%}
.menu button svg{width:22px;height:22px;flex:none;color:var(--muted)}
.menu button:active{background:var(--line)}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.swatch{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:2px solid var(--line);text-align:left}
.swatch.on{border-color:var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:14px;height:14px;border-radius:50%;display:block}
.swatch b{font-family:var(--font-ui);font-weight:600;font-size:14px}
.swatch .bg{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;font-size:15px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.colors button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.colors button.none{border:2px dashed var(--muted);background:transparent;font-size:12px;font-weight:700;color:var(--muted)}
.colors button:active{transform:scale(.9)}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.emojis button{aspect-ratio:1;font-size:26px;border-radius:12px}
.emojis button:active{background:var(--line)}
.emojis button.none{font-size:12px;font-weight:700;color:var(--muted);border:2px dashed var(--muted)}
.field{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.field:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:14px;font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--line);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{background:#C0392B;color:#fff}
.preview-img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;font-size:14px}
.tile svg{width:26px;height:26px}
.tile:active{background:var(--line)}
.tile.danger{color:var(--danger)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;min-height:40px}
.stk{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;padding:4px}
.stk img{width:100%;height:100%;object-fit:contain}
.stk:active{background:var(--line)}
.pad-wrap{width:min(100%,52dvh);aspect-ratio:1;margin:0 auto 12px;border-radius:16px;border:2px dashed var(--line);background:#fff;background-image:radial-gradient(#e6e3f0 1px,transparent 1px);background-size:18px 18px;overflow:hidden;touch-action:none}
#pad{width:100%;height:100%;display:block;touch-action:none}
.draw-colors{grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:10px}

/* ---------- ORBIT (3D) — dark cosmos, whatever the phone theme ---------- */

  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 52%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 33% 62%, rgba(255,255,255,.5) 50%, transparent 52%),
    radial-gradient(1px 1px at 61% 78%, rgba(255,255,255,.35) 50%, transparent 52%),
    radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.45) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 8% 85%, rgba(255,255,255,.3) 50%, transparent 52%),
    radial-gradient(1px 1px at 48% 30%, rgba(255,255,255,.4) 50%, transparent 52%),
    radial-gradient(120% 90% at 50% 12%, #201c3e 0%, #0B0A18 60%);
  background-color:#0B0A18}

#orbit .otop{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;pointer-events:none}
#orbit .otop>*{pointer-events:auto}
#orbit .otitle{flex:1;min-width:0;padding:4px 2px}
#orbit .otitle b{display:block;font-family:var(--font-ui);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orbit .otitle span{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orbit .ctrl{background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(10px);font-family:var(--font-ui);font-weight:600;font-size:13px;padding:9px 13px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--paper)}
#orbit .ctrl svg{width:16px;height:16px}
#orbit .ctrl.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#orbit .ctrl:active{transform:scale(.96)}
#orbit.presenting .otop .ctrl:not(#o-back){display:none}
#orbit .olegend{position:absolute;left:16px;z-index:15;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#orbit .olegend span{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font-ui)}
#orbit .olegend i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 1px var(--c)}
#orbit .ocaption{position:absolute;left:0;right:0;bottom:0;z-index:12;pointer-events:none;padding:40px 18px calc(92px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(11,10,24,0),rgba(11,10,24,.9) 45%)}
#orbit .cap-inner{max-width:560px;margin:0 auto}
#orbit .caplink{pointer-events:auto;margin-top:8px;text-decoration:none;font-size:12.5px;padding:7px 12px}
#orbit .cap-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
#orbit .pill{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
#orbit .cap-title{font-family:var(--font-ui);font-weight:700;font-size:18px;line-height:1.25;text-wrap:balance}
#orbit .cap-desc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#orbit.presenting .cap-title{font-size:21px}
#orbit.presenting .cap-desc{font-size:15.5px;color:#C9C5E2}
#orbit .act.on{color:var(--accent)}
#orbit .act[disabled]{opacity:.35}
#orbit .pstep{align-self:center;font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#orbit.presenting .odock{display:none}
.lbl{display:block;margin:16px 0 7px;font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ocolors{display:flex;flex-wrap:wrap;gap:10px}
.ocolors button{width:34px;height:34px;aspect-ratio:auto;border-radius:50%;border:3px solid transparent}
.ocolors button.on{border-color:var(--ink)}
.ocolors button.none{width:auto;padding:0 10px;border-radius:999px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tips{font-size:14px;color:var(--muted);line-height:1.6}
.tips b{color:var(--ink)}
.tips li{margin-bottom:6px}
.gwrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch;max-width:100%}
.gtab{border-collapse:separate;border-spacing:0;font-size:13px}
.gtab th,.gtab td{padding:2px;background:var(--surface);border-bottom:1px solid var(--line);text-align:center}
.gtab thead th{position:sticky;top:0;z-index:2}
.gtab .gfirst{position:sticky;left:0;z-index:1;text-align:left;max-width:118px;min-width:96px;padding:2px 6px;border-right:1px solid var(--line);font-weight:500}
.gtab .gfirst span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.gtab thead .gfirst{z-index:3}
.ghead{font:600 11px/1.1 inherit;font-family:inherit;min-width:44px;min-height:36px;padding:2px 4px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.gcell{position:relative;width:44px;height:38px;border-radius:8px;border:2px solid transparent;font:700 16px/1 inherit;font-family:inherit;color:#fff}
.gcell i{position:absolute;right:1px;top:0;font-size:10px;font-style:normal}
.gcell.g-chg{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.gcell:disabled,.ghead:disabled{opacity:.45}
.g-open{background:#1E8E4E;color:#fff}.g-ask{background:#E0A020;color:#2A1B00}.g-hidden{background:#C2362F;color:#fff}
.gkey{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:800;padding:0 3px}
.gconfirm{margin-top:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
</style>

      <button class="icon-btn" id="home-menu-btn" aria-label="Settings and backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
      </button></span>

 पर क्या करें।", "Read": "पढ़ें", "Flags": "चेतावनियाँ", "Nothing to settle. 🙏": "कुछ तय करने को नहीं। 🙏", "Volunteers": "स्वयंसेवक", "{c} checked · {w} this week · agree {r} · {s} per point · last active {d} days ago": "{c} जाँचे · इस सप्ताह {w} · मेल {r} · प्रति बिंदु {s} · आखिरी बार {d} दिन पहले", "What to do with a flag": "चेतावनी आने पर क्या करें", "Two checks disagree: tap Look, hear the moment yourself, then choose Keep Verified or Needs fixing. Claude fixes the words; the point is checked again.": "दो जाँचें मेल नहीं खातीं: देखें दबाएँ, क्षण खुद सुनें, फिर \"सत्यापित रखें\" या \"सुधार चाहिए\" चुनें। Claude शब्द ठीक करता है; बिंदु फिर से जाँचा जाता है।", "No checks for 7 days: send a short, kind message yourself. No pressure — this is seva.": "7 दिनों से कोई जाँच नहीं: खुद एक छोटा, स्नेहभरा संदेश भेजें। कोई दबाव नहीं — यह सेवा है।", "Marks too quick: remind them to hear each moment. Quick marks simply do not count.": "बहुत जल्दी निशान: उन्हें हर क्षण सुनने की याद दिलाएँ। जल्दी के निशान गिने ही नहीं जाते।", "Flags you do not settle in 3 days go to the backup devotees, then to KKD. Until then the points stay not verified.": "जो चेतावनियाँ आप 3 दिन में तय नहीं करते, वे सहायक भक्तों को, फिर KKD को जाती हैं। तब तक बिंदु असत्यापित रहते हैं।", "Keep Verified": "सत्यापित रखें", "verified": "सत्यापित", "checked once": "एक बार जाँचे", "need fixing or settling": "सुधार या निर्णय चाहिए", "questions for Maharaj": "महाराज से प्रश्न", "{p} points in all.": "कुल {p} बिंदु।", "Morning note (last 24 hours)": "सुबह का सार (पिछले 24 घंटे)", "{m} marks by {k} people · {v} newly verified · {f} need fixing · {q} questions · {j} joined · {i} inactive 7+ days · {vo} volunteers, {su} supervisors": "{k} लोगों के {m} निशान · {v} नए सत्यापित · {f} सुधार चाहिए · {q} प्रश्न · {j} जुड़े · {i} 7+ दिन से निष्क्रिय · {vo} स्वयंसेवक, {su} पर्यवेक्षक", "Team and flags": "टीम और चेतावनियाँ", "Each square is a class: grey none verified, deeper green as more is verified. Red dot: needs fixing. Blue dot: a question for Maharaj. Tap a square to see every point.": "हर वर्ग एक कक्षा है: धूसर यानी कुछ सत्यापित नहीं, जितना ज़्यादा सत्यापित उतना गहरा हरा। लाल बिंदी: सुधार चाहिए। नीली बिंदी: महाराज से प्रश्न। हर बिंदु देखने के लिए वर्ग दबाएँ।", "Could not reach Manas — check the connection": "मानस तक नहीं पहुँच पाए — इंटरनेट जाँचें", "set aside": "अलग रखा गया", "Nobody has checked this point yet.": "इस बिंदु को अभी किसी ने नहीं जाँचा।", "The audio starts where the point is spoken (Hear this moment).": "ऑडियो वहीं से शुरू होता है जहाँ यह बिंदु कहा गया है (यह क्षण सुनें)।", "The transcript for that section matches what you hear.": "उस हिस्से की प्रतिलिपि वही है जो आप सुनते हैं।", "The point captures what Maharaj is actually saying there, within his argument.": "बिंदु वही पकड़ता है जो महाराज वहाँ, अपने तर्क के भीतर, वास्तव में कह रहे हैं।", "Read on its own, the point gives the right meaning — nothing out of context.": "अकेले पढ़ने पर भी बिंदु सही अर्थ देता है — कुछ भी संदर्भ से बाहर नहीं।", "No more and no less than Maharaj said; nothing added from elsewhere.": "महाराज ने जितना कहा उससे न ज़्यादा, न कम; कहीं और से कुछ जोड़ा नहीं।", "Names and places are right.": "नाम और स्थान सही हैं।", "Verse references (chapter and verse) match what he quotes.": "श्लोक संदर्भ (अध्याय और श्लोक) उनके उद्धरण से मेल खाते हैं।", "Sanskrit spelling follows the BBT standard (Prabhupada's books).": "संस्कृत वर्तनी BBT मानक (प्रभुपाद की पुस्तकों) के अनुसार है।", "Not checked yet": "अभी जाँचा नहीं गया", "Checked once — waiting for the second check": "एक बार जाँचा — दूसरी जाँच की प्रतीक्षा", "Verified (two agree)": "सत्यापित (दो सहमत)", "not checked": "जाँचा नहीं", "once": "एक बार", "needs fixing": "सुधार चाहिए", "question": "प्रश्न", "None": "कोई नहीं", "Volunteer": "स्वयंसेवक", "Supervisor": "पर्यवेक्षक", "Backup": "सहायक", "Review role (volunteer tasks)": "समीक्षा भूमिका (स्वयंसेवक काम)", "In the beta you see only the series being verified.": "बीटा में आपको केवल वही श्रृंखला दिखती है जिसकी जाँच हो रही है।", "Whole series": "पूरी श्रृंखला", "Welcome": "स्वागत है", "Hare Krishna, and thank you. You are helping to check HH Bhakti Dhira Damodara Swami's classes in Manas, so every point can be trusted. About 15 to 20 minutes a day is plenty. This is seva: no pressure.": "हरे कृष्ण, और धन्यवाद। आप मानस में परम पूज्य भक्ति धीर दामोदर स्वामी की कक्षाओं की जाँच में मदद कर रहे हैं, ताकि हर बिंदु पर भरोसा किया जा सके। दिन में लगभग 15 से 20 मिनट काफ़ी हैं। यह सेवा है: कोई दबाव नहीं।", "Your task": "आपका काम", "Each day you get a small batch of points, about 15, from one class. On the home screen tap Today's task, then Start. You see only the series being checked, and nobody else's task.": "हर दिन आपको एक कक्षा से लगभग 15 बिंदुओं का छोटा समूह मिलता है। होम स्क्रीन पर \"आज का काम\" और फिर \"शुरू करें\" दबाएँ। आपको केवल वही श्रृंखला दिखती है जिसकी जाँच हो रही है, और किसी और का काम नहीं।", "Listen first": "पहले सुनें", "For each point, tap Hear this moment and listen to Maharaj at that place in the class. Read the point. Tap Transcript if you want to see the exact words.": "हर बिंदु के लिए \"यह क्षण सुनें\" दबाएँ और कक्षा में उसी जगह महाराज को सुनें। बिंदु पढ़ें। सटीक शब्द देखने हों तो \"प्रतिलिपि\" दबाएँ।", "What to check": "क्या जाँचें", "The moment is right. The transcript matches. The point says what Maharaj means there, and makes sense on its own. Nothing added. Names, places, verse numbers and Sanskrit spelling are right. The card What verified means has all eight checks.": "क्षण सही है। प्रतिलिपि मेल खाती है। बिंदु वही कहता है जो महाराज वहाँ कहना चाहते हैं, और अकेले भी सही अर्थ देता है। कुछ जोड़ा नहीं। नाम, स्थान, श्लोक संख्या और संस्कृत वर्तनी सही हैं। \"सत्यापित का अर्थ\" कार्ड में सभी आठ जाँचें हैं।", "Your answer": "आपका उत्तर", "All right: Verified. Something off: Needs fixing, and say what in a few words. You cannot judge it: Not sure, and it goes to someone else. A doubt about the meaning or the teaching: Question for Maharaj.": "सब सही: सत्यापित। कुछ गलत: सुधार चाहिए, और कुछ शब्दों में बताएँ क्या। तय नहीं कर पा रहे: पक्का नहीं, और यह किसी और को जाएगा। अर्थ या शिक्षा पर संदेह: महाराज से प्रश्न।", "Take your time": "समय लें", "Every point is checked by two different people, and a few are spot-checked. Marks made in under 10 seconds do not count. Your own numbers are in My progress, open to you.": "हर बिंदु दो अलग लोग जाँचते हैं, और कुछ की बीच-बीच में जाँच होती है। 10 सेकंड से कम में लगे निशान नहीं गिने जाते। आपके अपने आँकड़े \"मेरी प्रगति\" में आपके लिए खुले हैं।", "No internet? No problem": "इंटरनेट नहीं? कोई बात नहीं", "Your marks are kept on the phone and sent when you are back online. When a batch is done you can rest, or tap Give me more.": "आपके निशान फ़ोन में रखे रहते हैं और ऑनलाइन होते ही भेज दिए जाते हैं। एक समूह पूरा होने पर आप आराम कर सकते हैं, या \"और दीजिए\" दबा सकते हैं।", "Help is near": "मदद पास है", "A supervisor looks after your group and can help you. You can stop at any time from My progress. Thank you for your seva.": "एक पर्यवेक्षक आपके समूह की देखभाल करते हैं और आपकी मदद कर सकते हैं। आप \"मेरी प्रगति\" से कभी भी रुक सकते हैं। आपकी सेवा के लिए धन्यवाद।", "Welcome, supervisor": "स्वागत है, पर्यवेक्षक", "Hare Krishna, and thank you. You look after a small group of volunteers checking HH Bhakti Dhira Damodara Swami's classes. You do not check points yourself: you settle what the rules cannot.": "हरे कृष्ण, और धन्यवाद। आप परम पूज्य भक्ति धीर दामोदर स्वामी की कक्षाएँ जाँचने वाले स्वयंसेवकों के एक छोटे समूह की देखभाल करते हैं। आप खुद बिंदु नहीं जाँचते: जो नियम तय नहीं कर पाते, वह आप तय करते हैं।", "On the home screen tap My team. You see each of your volunteers: points checked, this week, how often they agree with the second check, time per point, and when they were last active.": "होम स्क्रीन पर \"मेरी टीम\" दबाएँ। आपको हर स्वयंसेवक दिखता है: जाँचे गए बिंदु, इस सप्ताह, दूसरी जाँच से कितनी बार मेल, प्रति बिंदु समय, और आखिरी बार कब सक्रिय थे।", "When one volunteer says Verified and another says Needs fixing, a flag appears. Tap Look, hear the moment yourself, then choose Keep Verified or Needs fixing. Your decision counts as a check.": "जब एक स्वयंसेवक \"सत्यापित\" और दूसरा \"सुधार चाहिए\" कहता है, तो चेतावनी आती है। \"देखें\" दबाएँ, क्षण खुद सुनें, फिर \"सत्यापित रखें\" या \"सुधार चाहिए\" चुनें। आपका निर्णय एक जाँच गिना जाता है।", "Quiet or too quick": "चुप या बहुत जल्दी", "No checks for 7 days: send a short, kind message yourself. Marks too quick: remind them to hear each moment. Quick marks simply do not count. No pressure: this is seva.": "7 दिनों से कोई जाँच नहीं: खुद एक छोटा, स्नेहभरा संदेश भेजें। बहुत जल्दी निशान: उन्हें हर क्षण सुनने की याद दिलाएँ। जल्दी के निशान गिने ही नहीं जाते। कोई दबाव नहीं: यह सेवा है।", "Three days": "तीन दिन", "Flags you have not settled in 3 days go to the backup devotees, then to KKD. Until someone settles them, those points stay not verified, so nothing wrong is ever shown as checked.": "जो चेतावनियाँ आप 3 दिन में तय नहीं करते, वे सहायक भक्तों को, फिर KKD को जाती हैं। जब तक कोई तय नहीं करता, वे बिंदु असत्यापित रहते हैं, इसलिए कुछ भी गलत कभी जाँचा हुआ नहीं दिखता।", "Questions for Maharaj": "महाराज से प्रश्न", "Questions about the meaning or the teaching go to KKD and the senior devotee, not to you. Please do not judge the teaching: only whether the point matches what Maharaj said.": "अर्थ या शिक्षा के प्रश्न KKD और वरिष्ठ भक्त को जाते हैं, आपको नहीं। कृपया शिक्षा का निर्णय न करें: केवल यह कि बिंदु महाराज के कहे से मेल खाता है या नहीं।", "You see your volunteers' emails only so that you can contact them. Please do not share them. Thank you for your seva.": "आपको स्वयंसेवकों के ईमेल केवल उनसे संपर्क के लिए दिखते हैं। कृपया इन्हें साझा न करें। आपकी सेवा के लिए धन्यवाद।", "You are a backup devotee: you see only flags a supervisor has not settled in 3 days. Settle them the same way: Look, hear the moment, then Keep Verified or Needs fixing. Unsettled flags then go to KKD.": "आप सहायक भक्त हैं: आपको केवल वे चेतावनियाँ दिखती हैं जिन्हें पर्यवेक्षक ने 3 दिन में तय नहीं किया। उन्हें वैसे ही तय करें: देखें, क्षण सुनें, फिर \"सत्यापित रखें\" या \"सुधार चाहिए\"। बिना तय हुई चेतावनियाँ फिर KKD को जाती हैं।", "Welcome, backup devotee": "स्वागत है, सहायक भक्त", "Hare Krishna, and thank you. When a supervisor is busy, you step in. You do not check points yourself: you settle the flags that have waited too long.": "हरे कृष्ण, और धन्यवाद। जब पर्यवेक्षक व्यस्त हों, तब आप आगे आते हैं। आप खुद बिंदु नहीं जाँचते: बहुत देर से रुकी चेतावनियाँ आप तय करते हैं।", "Supervisors": "पर्यवेक्षक", "{v} volunteers · {c} checks by them this week · {f} flags waiting{o}": "{v} स्वयंसेवक · इस सप्ताह उनकी {c} जाँचें · {f} चेतावनियाँ बाकी{o}", "oldest {d} days": "सबसे पुरानी {d} दिन", "Team and supervisors": "टीम और पर्यवेक्षक", "You are a supervisor": "आप पर्यवेक्षक हैं", "You are a backup devotee": "आप सहायक भक्त हैं", "Flags that waited 3 days come to you in My team.": "3 दिन से रुकी चेतावनियाँ \"मेरी टीम\" में आपके पास आती हैं।", "Your volunteers' work and anything to settle are in My team.": "आपके स्वयंसेवकों का काम और तय करने वाली बातें \"मेरी टीम\" में हैं।", "You joined. Your home now shows what to do.": "आप जुड़ गए। अब आपकी होम स्क्रीन बताती है कि क्या करना है।", "What should we call you?": "आपको किस नाम से बुलाएँ?", "Your name as your team knows you, e.g. Radha Mataji or Govinda Prabhu. Supervisors and the Manas team see it beside your work.": "वह नाम जिससे आपकी टीम आपको जानती है, जैसे राधा माताजी या गोविंद प्रभु। पर्यवेक्षक और मानस टीम इसे आपके काम के साथ देखते हैं।", "Write your name first": "पहले अपना नाम लिखें", "Announcements": "सूचनाएँ", "Announcement": "सूचना", "own team": "अपनी टीम", "Nothing yet. Messages from the Manas team and your supervisor appear here.": "अभी कुछ नहीं। मानस टीम और आपके पर्यवेक्षक के संदेश यहाँ दिखेंगे।", "Bigger text": "बड़े अक्षर", "Send a message": "संदेश भेजें", "It pops up in the app for the people you choose, and stays under the bell.": "यह आपके चुने लोगों के ऐप में खुलकर दिखता है, और घंटी में बना रहता है।", "It pops up in the app for your volunteers, and stays under the bell.": "यह आपके स्वयंसेवकों के ऐप में खुलकर दिखता है, और घंटी में बना रहता है।", "Everyone": "सभी", "Title, e.g. This week's classes": "शीर्षक, जैसे इस सप्ताह की कक्षाएँ", "Your message": "आपका संदेश", "Send": "भेजें", "Sent. It appears the next time they open the app, or within a few minutes.": "भेज दिया। यह अगली बार ऐप खोलने पर, या कुछ ही मिनटों में दिखेगा।", "Send an announcement": "सूचना भेजें", "Message my volunteers": "मेरे स्वयंसेवकों को संदेश", "Change name": "नाम बदलें", "Supervisor: {n}": "पर्यवेक्षक: {n}", "Read aloud": "पढ़कर सुनाएँ", "Sent — you can still change it": "भेज दिया — आप अब भी बदल सकते हैं", "Morning note": "सुबह का सार", "8-letter code, e.g. K7QM4XPA": "8 अक्षरों का कोड, जैसे K7QM4XPA", "A few words, please": "कृपया कुछ शब्द लिखें", "A new link is on its way. Use the newest email.": "नया लिंक भेजा जा रहा है। सबसे नए ईमेल का उपयोग करें।", "A supervisor or backup sees only their desk: no shelf, no own maps, no library list.": "पर्यवेक्षक या बैकअप केवल अपना डेस्क देखते हैं: कोई शेल्फ़ नहीं, अपने मैप नहीं, लाइब्रेरी सूची नहीं।", "By tapping Next you agree to the": "आगे टैप करके आप सहमत होते हैं", "Change email": "ईमेल बदलें", "Check now": "अभी जाँचें", "Checking…": "जाँच हो रही है…", "Hare Krishna. Three short steps and you are in.": "हरे कृष्ण। तीन छोटे कदम और आप अंदर हैं।", "Join": "जुड़ें", "KKD's home shows Verification desk and Test lab. A tester's home shows What to test.": "KKD की होम स्क्रीन पर सत्यापन डेस्क और टेस्ट लैब दिखते हैं। टेस्टर की होम पर ‘क्या जाँचना है’ दिखता है।", "Let go to refresh": "रिफ़्रेश के लिए छोड़ दें", "New beta — opening it…": "नया बीटा — खुल रहा है…", "No code? If Manas already knows your email, the link alone lets you in.": "कोड नहीं है? यदि Manas आपका ईमेल पहले से जानता है, तो केवल लिंक से आप अंदर आ जाएँगे।", "Not confirmed yet. Open the link in the email, then tap Check now.": "अभी पुष्टि नहीं हुई। ईमेल में लिंक खोलें, फिर ‘अभी जाँचें’ टैप करें।", "On a new phone or browser, open the beta: one screen asks language, name, email, then the code.": "नए फ़ोन या ब्राउज़र पर बीटा खोलें: एक स्क्रीन भाषा, नाम, ईमेल और फिर कोड पूछती है।", "On the home screen, pull down from the top and let go: it checks for new tasks, announcements and a new version.": "होम स्क्रीन पर ऊपर से नीचे खींचें और छोड़ दें: यह नए कार्य, घोषणाएँ और नया संस्करण जाँचता है।", "Problem": "समस्या", "Pull down to refresh": "रिफ़्रेश के लिए नीचे खींचें", "Refreshing…": "रिफ़्रेश हो रहा है…", "Send link again": "लिंक फिर भेजें", "Supervisor desk": "पर्यवेक्षक डेस्क", "Swipe down to refresh": "नीचे खींचकर रिफ़्रेश", "Test lab": "टेस्ट लैब", "Thank you — sent": "धन्यवाद — भेज दिया", "This list: tap Works or Problem for each feature. Problems need a few words.": "यह सूची: हर सुविधा के लिए ‘काम करता है’ या ‘समस्या’ टैप करें। समस्या के लिए कुछ शब्द लिखें।", "This phone is confirmed.": "इस फ़ोन की पुष्टि हो गई है।", "Try each new feature, then tap Works or Problem.": "हर नई सुविधा आज़माएँ, फिर ‘काम करता है’ या ‘समस्या’ टैप करें।", "Turn off": "बंद करें", "Turn on": "चालू करें", "Turned off for everyone": "सभी के लिए बंद कर दिया", "Turned on for everyone": "सभी के लिए चालू कर दिया", "Two doors": "दो द्वार", "Type the 8-letter code you were given (volunteer, supervisor, backup or tester).": "आपको मिला 8 अक्षरों का कोड लिखें (स्वयंसेवक, पर्यवेक्षक, बैकअप या टेस्टर)।", "Up to date": "सब नवीनतम है", "Use the app as usual, then tell us in What to test whether each new feature works.": "ऐप हमेशा की तरह चलाएँ, फिर ‘क्या जाँचना है’ में बताएँ कि हर नई सुविधा काम करती है या नहीं।", "Used only for Manas and your team, never shared.": "केवल Manas और आपकी टीम के लिए, कभी साझा नहीं किया जाता।", "Verification desk": "सत्यापन डेस्क", "Verification desk: progress, team, announcements. Test lab: the full app and What to test.": "सत्यापन डेस्क: प्रगति, टीम, घोषणाएँ। टेस्ट लैब: पूरा ऐप और ‘क्या जाँचना है’।", "We emailed a link to {e}. Tap it once (check Spam too) — the app goes on by itself.": "हमने {e} पर एक लिंक ईमेल किया है। उसे एक बार टैप करें (स्पैम भी देखें) — ऐप अपने आप आगे बढ़ेगा।", "Welcome screen": "स्वागत स्क्रीन", "What to test": "क्या जाँचना है", "What went wrong?": "क्या गड़बड़ हुई?", "Works": "काम करता है", "You are a tester": "आप टेस्टर हैं", "You joined.": "आप जुड़ गए।", "You joined. Now tap the link in your email — the app goes on by itself.": "आप जुड़ गए। अब अपने ईमेल का लिंक टैप करें — ऐप अपने आप आगे बढ़ेगा।", "Your code": "आपका कोड", "Your email": "आपका ईमेल", "e.g. Radha Mataji or Govinda Prabhu": "जैसे राधा माताजी या गोविंद प्रभु", "off": "बंद", "terms of use": "उपयोग की शर्तें", "🔊 Read aloud": "🔊 पढ़कर सुनाएँ", "Bubbles": "बुलबुले", "Soft": "नरम", "Classic": "पहले जैसे", "Phone reading": "फ़ोन पर पढ़ना", "Easy": "आसान"}};
const WHATS_NEW = /* __WHATSNEW__ */ [{"version": "7.30", "date": "15 Nov 2026", "items": [{"icon": "⬇", "title": "Beta first: big libraries open faster, one map at a time", "how": "In Manas Beta, Soil Life now adds in a moment: only its list of maps comes down, and each map downloads the first time you open it, then stays on your phone. To have every map offline (and in search and flashcards), go to home menu (⋮) → Libraries → ⓘ on Soil Life → Download whole library."}, {"icon": "🔒", "title": "Adding a locked library now shows the request screen", "how": "Home menu (⋮) → Libraries → Add on a library with a padlock (for example Maharaj's Rupa Siksa): the Request access screen now stays open, so you can ask for access at once. Before, the list redrew over it and the tap looked as if nothing happened."}, {"icon": "✉️", "title": "Email links open on the Manas website", "how": "The links in Manas emails (confirm this phone, confirm updates, unsubscribe) now open a short Manas page that confirms by itself. They work even when your browser is signed in to two Google accounts."}, {"icon": "🌍", "title": "New library: Bhagavad-gita in your language", "how": "Home menu (⋮) → Libraries → 🌍 Bhagavad-gita in your language → Add. Pick your language (Hindi, Swahili, Gujarati, Bengali, Tamil, Telugu, Kannada, Marathi, Spanish or French): every verse of Chapter 1 as one short line in that language; tap a bubble to open the verse on vedabase.io. A draft — if you are a native speaker, tell us what to fix."}]}, {"version": "7.29", "date": "12 Nov 2026", "items": [{"icon": "🛡️", "title": "For admins: People is now a table", "how": "Home menu (⋮) → Admin → People. One row per email, one small button per library. Tap a box: ✓ green has access → ? amber must ask → 🔒 red hidden. Tap a library name to set the whole column, All to set the whole row. Nothing changes until you tap Save, which first shows how many changes for how many people; Undo takes back the last tap. List view keeps the old screen."}, {"icon": "🙈", "title": "A library can be hidden from one person", "how": "If the Manas team hides a library for you, it no longer shows in home menu (⋮) → Libraries. Nothing else changes for anyone else."}]}, {"version": "7.28", "date": "10 Nov 2026", "items": [{"icon": "📖", "title": "Every update now checks its own documentation", "how": "Before a new version can be built or published, Manas checks that the guide (home menu (⋮) → Guide), What's new, the changelog and the public guide page all describe it, and that no document was left half-written. Nothing for you to do — it means the guide you read always matches the app you have."}, {"icon": "🛡️", "title": "For admins: Admin set-up page", "how": "For the Manas team. If the Admin panel (home menu (⋮) → Admin) is not connected yet, it now says so and links to a one-page set-up guide with the exact clicks to deploy the sheet script and test one approval."}, {"icon": "🔒", "title": "Privacy policy updated", "how": "Home menu (⋮) → Privacy now carries the 9 November text on locked libraries, end dates and the 7-day rule (the same text the app showed since 7.27, now also in the written policy)."}]}, {"version": "7.27", "date": "9 Nov 2026", "items": [{"icon": "⏳", "title": "Access with an end date", "how": "Some approvals last a set time, for example 30 days. Home menu (⋮) → Libraries shows “You have access until …” on that library. A week before it ends, the home screen says “Your access to … ends on …” with Ask to extend — one tap sends the request; you keep access meanwhile. After the date the library locks and its padlock sheet says when it ended, so you can ask again."}, {"icon": "📶", "title": "Locked libraries work offline — connect once a week", "how": "Libraries you were approved for open without internet. If the phone has not connected for 7 days they lock until it connects once (the home screen and the padlock sheet say so). Private (🔐) maps stay encrypted on the phone until then. Details: home men function countNodes(n){ return n ? 1 + (n.children||[]).reduce((a,c)=>a+countNodes(c),0) : 0; }
function relTime(ts){
  const d = Date.now()-ts, m=Math.round(d/60000), h=Math.round(d/3600000), dd=Math.round(d/86400000);
  if (m<1) return 'just now'; if (m<60) return m+' min ago'; if (h<24) return h+' h ago'; if (dd<7) return dd+' d ago';
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

function fold(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); } // Prahlāda matches "prahlada"

      if (fold(t).includes(q) || fold(note).includes(q)) hits.push({ map: m, id: n.id, topic: t, where: parent ? String(parent.topic||'') : '', note: fold(note).includes(q) && !fold(t).includes(q) ? note : '' });

function revealNode(id){

/* KKD, 13 Nov 2026: "a tap moves it one step; long press still opens the normal menu".
   A map you own can switch on a three-step cycle of marks. Ready sets: Tasks, Study, Decide, Review, or your own three words (each with a sign from a fixed list).
   BETA: every entry point is behind marksBeta() = settings.beta + the app's own super-admin check. For everyone else nothing here shows or runs;
   marks already in a map's data are kept untouched and simply not drawn.
   DATA (all inside nodeData, so save, backup, move files, share links, Duplicate and Undo carry it; older versions ignore it):

   Everything read from manas.marks is checked (marksCfgOf, marksSetOf, mkStr): a hand-edited or damaged file means "marks off", never an error.
   THE TAP AREA, decided once: every end bubble (no children, not a door) carries one child, the sign .mkb, whose tap area (.mkb::after) is as wide as the bubble and MK_PITCH (50) map pixels tall
   (or the bubble's own height if taller), centred on it; end bubbles are spaced so two areas never overlap. A tap anywhere in it marks. Because the tap lands on
   the sign and not on the bubble itself, the map never selects the bubble, so a tap can never "only select". Tick boxes, doors and links sit above the area and behave as before.
   Press and hold (half a second) selects the bubble and opens the normal menu. Below zoom MK_ZMIN the area would be under 44 px on the screen: a tap there does not mark, it says "Zoom in to mark".
   CHEAP BY DESIGN: a tap repaints one bubble and the count chips of its ancestors at once; the strip, the message and the history entry follow just after that frame (marksFlush). The full pass (marksDecor) runs only from applyDecor.
   HOOKS: eleven lines outside this block call in here. Each is a line of its own and ends with "// Tap to mark"; no existing line is edited (so a merge only ever adds lines).
   The menu row and the Admin switch are put into their sheets from here (marksMenuWire, marksBetaWire). Hindi: tools/add-lang-keys.py + tools/lang-keys/tap-to-mark-hi.json. */

function photoToNode(tpc, file){
  if (!file) return;
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 480; const r = Math.min(1, MAX/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', 0.82); const w = 160, h = Math.round(160 * c.height / c.width);
    setImage(tpc, { url:data, width:w, height:h }); toast(t('Photo added'));
  };

  img.src = url;
}

function drawSheet(tpc){
  const COLORS = ['#22203A','#E8743B','#F2A93B','#D9534F','#8E44AD','#1F6FB2','#2BB3A3','#3F8F4E','#FFFFFF'];
  let color = COLORS[0], size = 6, strokes = [], cur = null;
  sheet(`<h2>${t('Draw it')}</h2><p class="sub">${t('Use your finger. Keep it simple — small doodles read best.')}</p>
    <div class="pad-wrap"><canvas id="pad" width="600" height="600" aria-label="Drawing pad"></canvas></div>
    <div class="colors draw-colors">${COLORS.map(c=>`<button data-dc="${c}" style="background:${c};${c===color?'border-color:var(--accent)':''}${c==='#FFFFFF'?';outline:1px solid var(--line)':''}"></button>`).join('')}</div>
    <div class="row" style="align-items:center">
      <div class="chips"><button class="chip" data-sz="3">${t('Thin')}</button><button class="chip on" data-sz="6">${t('Medium')}</button><button class="chip" data-sz="12">${t('Thick')}</button></div>
      <button class="btn" id="dr-undo" style="flex:0 0 auto">${t('Undo')}</button><button class="btn" id="dr-clear" style="flex:0 0 auto">${t('Clear')}</button>
    </div>
    <div class="row"><button class="btn" id="dr-cancel">${t('Cancel')}</button><button class="btn primary" id="dr-ok">${t('Use this drawing')}</button></div>`, s => {
      const cv = $('#pad',s), ctx = cv.getContext('2d');
      const redraw = () => { ctx.clearRect(0,0,cv.width,cv.height); for (const st of strokes.concat(cur?[cur]:[])){ ctx.strokeStyle = st.c; ctx.lineWidth = st.w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath();
        st.p.forEach((pt,i)=> i ? ctx.lineTo(pt[0],pt[1]) : ctx.moveTo(pt[0],pt[1])); if (st.p.length===1) ctx.lineTo(st.p[0][0]+0.1, st.p[0][1]); ctx.stroke(); } };
      const pos = e => { const r = cv.getBoundingClientRect(); return [ (e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height ]; };
      cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); cur = { c:color, w:size*2, p:[pos(e)] }; redraw(); e.preventDefault(); });
      cv.addEventListener('pointermove', e => { if (!cur) return; cur.p.push(pos(e)); redraw(); e.preventDefault(); });
      const end = () => { if (cur){ strokes.push(cur); cur=null; redraw(); } };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
      s.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { color = b.getAttribute('data-dc'); s.querySelectorAll('[data-dc]').forEach(x=>x.style.borderColor = x===b?'var(--accent)':''); });
      s.querySelectorAll('[data-sz]').forEach(b => b.onclick = () => { size = +b.getAttribute('data-sz'); s.querySelectorAll('[data-sz]').forEach(x=>x.classList.toggle('on', x===b)); });
      $('#dr-undo',s).onclick = () => { strokes.pop(); redraw(); };
      $('#dr-clear',s).onclick = () => { strokes = []; redraw(); };
      $('#dr-cancel',s).onclick = () => pictureSheet(tpc);
      $('#dr-ok',s).onclick = () => {
        if (!strokes.length){ toast(t('Draw something first')); return; }
        // crop to the drawn area with a margin, then shrink
        let x0=cv.width,y0=cv.height,x1=0,y1=0; for (const st of strokes) for (const p of st.p){ x0=Math.min(x0,p[0]-st.w); y0=Math.min(y0,p[1]-st.w); x1=Math.max(x1,p[0]+st.w); y1=Math.max(y1,p[1]+st.w); }
        x0=Math.max(0,x0); y0=Math.max(0,y0); x1=Math.min(cv.width,x1); y1=Math.min(cv.height,y1);
        const w=x1-x0, h=y1-y0, scale = Math.min(1, 240/Math.max(w,h));
        const out = document.createElement('canvas'); out.width=Math.round(w*scale); out.height=Math.round(h*scale);
        out.getContext('2d').drawImage(cv, x0,y0,w,h, 0,0,out.width,out.height);
        const dw = Math.min(120, out.width), dh = Math.round(dw*out.height/out.width);
        setImage(tpc, { url: out.toDataURL('image/png'), width:dw, height:dh }); toast(t('Drawing added'));
      };
  });
}



/* ---------------- drag ring: pick up the thread and re-hook it ---------------- */
function removeGrab(){ document.querySelectorAll('.map-container .grab').forEach(g=>g.remove()); }
function placeGrab(){
  removeGrab();
  const sel = selected(); if (!sel || isRoot(sel) || !mind.editable) return;
  const g = document.createElement('span'); g.className = 'grab'; g.setAttribute('aria-label','Drag to move this idea');
  const main = sel.closest('me-main'); const down = !!sel.closest('me-nodes.down');
  g.classList.add(down ? 'top' : (main && main.classList.contains('lhs')) ? 'right' : 'left');
  sel.appendChild(g);
  g.addEventListener('pointerdown', startThreadDrag);
}
function startThreadDrag(e){
  e.stopPropagation(); e.preventDefault();
  const from = e.currentTarget.parentElement; if (!from || !from.nodeObj) return;
  const g = e.currentTarget; try { g.setPointerCapture(e.pointerId); } catch(err){}
  const ghost = document.createElement('div'); ghost.className = 'thread-ghost'; ghost.textContent = from.nodeObj.topic || 'idea'; document.body.appendChild(ghost);
  let target = null, mode = null, moved = false;
  const clearMark = () => { if (target) target.classList.remove('drop-in','drop-before','drop-after'); };
  const isDescendant = tpc => { let p = tpc.nodeObj; while (p){ if (p === from.nodeObj) return true; p = p.parent; } return false; };
  const onMove = ev => {
    moved = true; ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    const el = document.elementFromPoint(ev.clientX, ev.clientY); const tpc = el && el.closest ? el.closest('me-tpc') : null;
    clearMark(); target = null; mode = null;
    if (!tpc || tpc === from || isDescendant(tpc)) return;
    const r = tpc.getBoundingClientRect(); const y = (ev.clientY - r.top) / r.height;
    if (isRoot(tpc)) mode = 'in'; else mode = y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'in';
    target = tpc; tpc.classList.add('drop-' + mode);
  };
  const onEnd = async ev => {
    g.removeEventListener('pointermove', onMove); g.removeEventListener('pointerup', onEnd); g.removeEventListener('pointercancel', onEnd);
    ghost.remove(); const t = target, m = mode; clearMark();
    if (!moved || !t) { if (!moved) hint(t('Drag this ring onto another bubble')); return; }
    if (m === 'in') await mind.moveNodeIn([from], t); else if (m === 'before') await mind.moveNodeBefore([from], t); else await mind.moveNodeAfter([from], t);
    scheduleSave(); const again = MindElixir.E(from.nodeObj.id); if (again) mind.selectNode(again); renderDock();
    toast(m === 'in' ? 'Now under “' + (t.nodeObj.topic||'').slice(0,20) + '”' : 'Moved ' + m + ' “' + (t.nodeObj.topic||'').slice(0,20) + '”');
  };
  g.addEventListener('pointermove', onMove); g.addEventListener('pointerup', onEnd); g.addEventListener('pointercancel', onEnd);
}

/* ---------------- AI helper with your own free Google key (works on the website and in the Android app) ---------------- */
const GEMINI_DEFAULT = 'gemini-flash-latest', AISTUDIO = 'https://aistudio.google.com/apikey';
function geminiModels(){ const c = siteConfig || {}; return [c.gemini_model || GEMINI_DEFAULT].concat(c.gemini_fallbacks || ['gemini-2.5-flash', 'gemini-2.0-flash']).filter((x, i, a) => x && a.indexOf(x) === i); }
function makeGemini(key){
  async function json(prompt, opts){
    opts = opts || {}; let last = { code: 'network' };
    for (const m of geminiModels()){
      let r;
      try { r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(m) + ':generateContent?key=' + encodeURIComponent(key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: opts.signal,
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.4 } }) }); }
      catch(e){ if (e && e.name === 'AbortError') throw { code: 'cancelled' }; throw { code: 'network' }; }
      if (r.status === 404){ last = { code: 'no_model' }; continue; }
      if (r.status === 429) throw { code: 'rate_limited' };
      if (r.status === 400 || r.status === 401 || r.status === 403){ let tx = ''; try { tx = await r.text(); } catch(e){} throw { code: /API.?KEY|api key|PERMISSION_DENIED|UNAUTHENTICATED/i.test(tx) ? 'bad_key' : 'refused' }; }
      if (!r.ok) throw { code: 'network' };
      let j = {}; try { j = await r.json(); } catch(e){ throw { code: 'invalid_json' }; }
      const c = (j.candidates || [])[0] || {}; const txt = ((c.content || {}).parts || []).map(x => x.text || '').join('').trim();
      if (!txt) throw { code: ((j.promptFeedback && j.promptFeedback.blockReason) || c.finishReason === 'SAFETY') ? 'refused' : 'empty_completion' };
      try { return JSON.parse(txt.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '')); } catch(e){ throw { code: 'invalid_json' }; }
    }
    throw last;
  }
  return { provider: 'gemini', json };
}

/* ---------------- speaking instead of typing (browser speech; in the Android app the keyboard 🎤 does it) ---------------- */
const micBtn = id => `<button class="btn" id="${id}" style="flex:0 0 auto;display:inline-flex;gap:8px;align-items:center">${ico('mic')}<span>${t('Speak')}</span></button>`;
function attachMic(btn, ta, st, onStop){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!btn) return { stop(){} };
  if (!SR){ btn.hidden = true; if (st && !st.textContent) st.textContent = t('Tip: tap the 🎤 on your keyboard to speak instead of typing.'); return { stop(){} }; }
  let rec = null, on = false; const label = btn.querySelector('span');
  btn.onclick = () => {
    if (on){ try { rec.stop(); } catch(e){} return; }
    rec = new SR(); rec.lang = LANG === 'hi' ? 'hi-IN' : (navigator.language || 'en-GB'); rec.interimResults = true; rec.continuous = true;
    const base = ta.value ? ta.value.trim() + ' ' : '';
    rec.onresult = ev => { let fin = '', interim = ''; for (const r of ev.results){ if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript; } ta.value = base + fin + interim; };
    rec.onend = () => { on = false; if (label) label.textContent = t('Speak'); btn.classList.remove('primary'); if (st && /Listening/.test(st.textContent)) st.textContent = ''; if (onStop) onStop(); };
    rec.onerror = ev => { if (st) st.textContent = ev.error === 'not-allowed' ? t('Microphone not allowed — type instead, or use the 🎤 on your keyboard.') : ev.error === 'no-speech' ? t('Did not hear anything — try again.') : t('Could not hear you — try again.'); };
    try { rec.start(); on = true; if (label) label.textContent = t('Stop'); btn.classList.add('primary'); if (st) st.textContent = t('Listening… tap Stop when you finish.'); } catch(e){ if (st) st.textContent = t('Microphone not available here — use the 🎤 on your keyboard.'); }
  };
  return { stop(){ if (on){ try { rec.onend = null; rec.stop(); } catch(e){} on = false; } } };
}

/* ---------------- talk (or type) to build a map, one idea at a time ---------------- */
function talkSheet(){
  if (!mind || readOnly) return;
  const sel0 = selected(); const target = sel0 ? sel0.nodeObj : mind.nodeData;
  let mic = null, busy = false, pending = [], plainNext = false, ctl = null;
  sheet(`<h2>${ico('mic')} ${t('Talk to your map')}</h2>
    <p class="sub" id="tk-sub"></p>
    <textarea class="field" id="tk-text" rows="3" style="resize:vertical;font-size:16px" placeholder="${esc(t('Say or type one idea, e.g. “Under marketing: a WhatsApp results service”'))}"></textarea>

    <div class="menu" id="tk-list"></div>
    <div class="row"><button class="btn" id="tk-done">${t('Done')}</button><button class="btn primary" id="tk-go">${t('Add')}</button></div>
    ${ai ? noteAI() : `<p class="tips" style="font-size:12px">${t('Each idea goes under the bubble named above.')} <a href="#" id="tk-ai">${t('Turn on the AI helper')}</a> ${t('to have Manas place ideas where they fit.')}</p>`}`, s => {

      mic = attachMic($('#tk-mic', s), ta, st, () => { if (ta.value.trim().length > 2 && !busy && !pending.length) run(); });
      const tka = $('#tk-ai', s); if (tka) tka.onclick = ev => { ev.preventDefault(); mic.stop(); aiSetupSheet(talkSheet); };
      $('#tk-done', s).onclick = () => { mic.stop(); if (ctl) ctl.abort(); closeSheet(); renderDock(); };
      go.onclick = () => pending.length ? addPending() : run();
      async function run(){
        const text = ta.value.trim(); if (text.length < 2){ st.textContent = t('Say or type an idea first.'); return; }
        { const mkr = marksTalk(text); if (mkr){ st.textContent = mkr.msg; if (mkr.done) ta.value = ''; return; } }   // Tap to mark: "mark Call bank done"
        if (!ai || plainNext) return addPlain(text);
        busy = true; go.disabled = true; st.textContent = t('Finding where it fits…');
        const all = treeText(mind.nodeData); const outline = (all.length > 220 ? treeText(target) : all).join('\n');
        const prompt = `You help someone build a mind map on a phone by talking. Each outline line is: id|depth|bubble text.
OUTLINE:
${outline}

They just said: «${text.slice(0, 2000)}»
${sel0 ? 'They have the bubble ' + target.id + ' selected.' : ''}
Turn what they said into new bubbles. Put each new idea under the EXISTING bubble it belongs to (its id as "parent"). If nothing fits, use ${target.id}. If an idea is already on the map, do not add it again; put only new detail as children of that existing bubble. At most 6 words per bubble, plain language, keep their names and numbers, do not invent facts. Longer detail goes in "note". At most 8 new bubbles in total.
Reply with only JSON: {"items":[{"parent":"<existing id>","topic":"...","emoji":"","note":"","children":[{"topic":"...","children":[]}]}]}`;
        let res; ctl = new AbortController();
        try { res = await ai.json(prompt, { modelTier: 'quick', signal: ctl.signal, cache: false }); }
        catch(e){ busy = false; go.disabled = false; if (e.code === 'cancelled') return; if (aiGone(e)) return addPlain(text); st.textContent = aiErrorCopy(e) + ' ' + t('Tap Add to put it in as you said it.'); plainNext = true; return; }
        busy = false; go.disabled = false;
        const ids = new Set(); walkNodes(mind.nodeData, n => ids.add(n.id));
        const items = ((res && res.items) || []).filter(x => x && x.topic).slice(0, 8).map(x => Object.assign({}, x, { parent: ids.has(x.parent) ? x.parent : target.id }));
        if (!items.length){ st.textContent = t('Nothing new to add — it may already be on the map.'); return; }
        pending = items;
        list.innerHTML = items.map((x, i) => { const p = findNodeObj(x.parent); const kids = (x.children || []).filter(c => c && c.topic).length; return `<button class="pick on" data-i="${i}"><span class="tick on">✓</span><span>${x.emoji ? esc(String(x.emoji).slice(0, 4)) + ' ' : ''}<b>${esc(String(x.topic).slice(0, 60))}</b>${kids ? ' <small>+' + kids + '</small>' : ''}<br><small style="color:var(--muted)">${t('under')} “${esc(plain((p && p.topic) || '').slice(0, 40))}”</small></span></button>`; }).join('');
