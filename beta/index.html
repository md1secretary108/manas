        go.textContent = t('Add these'); st.textContent = t('Untick anything you do not want, then add.');
      }
      async function addTree(el, x){
        const node = mind.generateNewObj(); node.topic = String(x.topic).slice(0, 80); if (x.emoji) node.icons = [String(x.emoji).slice(0, 4)]; if (x.note) node.note = String(x.note).slice(0, 600);
        await mind.addChild(el, node); let n = 1; const kid = MindElixir.E(node.id);
        for (const c of (Array.isArray(x.children) ? x.children : []).slice(0, 8)) if (c && c.topic && kid) n += await addTree(kid, c);
        return n;
      }
      async function addPending(){
        const chosen = [...list.querySelectorAll('.pick.on')].map(b => pending[+b.getAttribute('data-i')]); let n = 0;
        for (const x of chosen){ const el = MindElixir.E(x.parent); if (el) n += await addTree(el, x); }
        finish(n);
      }
      async function addPlain(text){
        const el = MindElixir.E(target.id); let n = 0;
        for (const p of text.split(/\n+/).map(x => x.trim()).filter(Boolean)){ const short = p.length > 60 ? p.slice(0, 57).replace(/\s+\S*$/, '') + '…' : p; n += await addTree(el, { topic: short, note: short === p ? '' : p }); }
        finish(n);
      }
      function finish(n){
        pending = []; plainNext = false; list.innerHTML = ''; ta.value = ''; go.textContent = t('Add');
        try { const te = MindElixir.E(target.id); if (te) mind.selectNode(te); } catch(e){}
        applyDecor(); scheduleSave(); st.textContent = (n ? (n === 1 ? t('Added 1 bubble.') : t('Added') + ' ' + n + ' ' + t('bubbles.')) + ' ' + t('Next idea?') : t('Nothing added.'));
      }
  });
}

function startMerge(tpc){

function stampImage(blob){
  return new Promise(res => { const img = new Image(); const u = URL.createObjectURL(blob);
    img.onload = () => { const c = document.createElement('canvas'); const pad = 34; c.width = img.width; c.height = img.height + pad; const x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0);
      x.fillStyle = 'rgba(60,60,80,.75)'; x.font = '600 13px Outfit, system-ui, sans-serif'; x.textAlign = 'right';
      x.fillText('Made with Manas \u00b7 ' + COPYRIGHT, c.width - 12, img.height + 22);
      URL.revokeObjectURL(u); c.toBlob(b => res(b || blob), 'image/png'); };
    img.onerror = () => res(blob); img.src = u; });
}
/* 7.14 — teachers (panel of 50, 14 Oct 2026): share a map with a class as a link; print a map as a handout. No server needed. */
async function packMap(m){
  const json = JSON.stringify({ t: m.title || '', look: m.look, layout: m.layout, d: m.data.nodeData, a: m.data.arrows || [], s: m.data.summaries || [] }, (k, v) => (k === 'parent' || k === 'expanded') ? undefined : v);
  const bytes = new TextEncoder().encode(json);
  if (!window.CompressionStream) return 'j' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf = new Uint8Array(await new Response(cs).arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return 'z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackMap(str){
  const kind = str[0], b64 = str.slice(1).replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  if (kind === 'j') return JSON.parse(decodeURIComponent(escape(bin)));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(ds).text());
}

function parseIncoming(){
  try {
    const q = new URLSearchParams(location.search).get('open');
    if (q){ const [lib, part, map, node] = q.split('~').map(decodeURIComponent); return { kind: 'open', lib, part, map, node }; }
    const h = /[#&]map=([A-Za-z0-9_-]+)/.exec(location.hash); if (h) return { kind: 'map', data: h[1] };
  } catch(e){}
  return null;
}
async function openIncoming(inc){
  try { history.replaceState(null, '', location.pathname); } catch(e){}
  if (!inc) return false;
  if (inc.kind === 'open'){
    let m = maps.find(x => x.id === inc.map);
    if (!m){ const e = await catalogFor(inc.lib); if (!e){ toast(t('That library is not available')); return false; }
      try { await installLibrary(e, inc.part ? [inc.part] : null, true); settings.libChosen = true; saveSettings(settings); } catch(err){ if (!(err && err.locked)) toast(t('Could not load that part — check the connection')); return false; }
      m = maps.find(x => x.id === inc.map); }
    if (!m){ toast(t('That map is not on this device yet')); return false; }
    renderHome(); if (inc.node) await jumpTo({ map: m, id: inc.node }); else await openMap(m.id, false); return true;
  }
  if (inc.kind === 'map'){
    let o; try { o = await unpackMap(inc.data); } catch(e){ toast(t('This link is damaged — ask for it again')); return false; }
    const sig = 'share:' + inc.data.slice(0, 80); let m = maps.find(x => x.sharedFrom === sig);
    if (!m){ m = { id: uid(), title: o.t || 'Shared map', look: o.look || 'sunrise', layout: o.layout || 'side', created: Date.now(), updated: Date.now(), sharedFrom: sig,
                   data: { direction: (LAYOUTS[o.layout || 'side'] || LAYOUTS.side).dir, nodeData: o.d, arrows: o.a || [], summaries: o.s || [] } };
      maps.push(m); saveMap(m); toast(t('Map added to your maps')); }
    renderHome(); await openMap(m.id, false); return true;
  }
  return false;
}
function printOutline(m){

    rows.push(`<div class="r d${Math.min(d, 5)}"><b>${esc(plain(n.topic))}</b>${n.note ? `<p>${esc(String(n.note).split(/\n\n(?=🎙)/)[0])}</p>` : ''}${mm.q ? `<p class="q">Q: ${esc(mm.q)}</p>` : ''}${links.length ? `<p class="l">${links.slice(0, 3).map(u => esc(resolveUrl(u, m))).join(' · ')}</p>` : ''}</div>`);
    marksPrintRow(rows, n, m, d);   // Tap to mark: sign, word, note or count; the legend before the first row

function backupMaps(){ return maps.filter(m => !(m.library && !m.touched) && !(m.guide && !m.touched) && !sealedLib(m.library)); }   // 7.25: private libraries never leave the phone in a backup
async function backupAll(){
  saveNow();

  const libs = [...new Set(maps.filter(m => m.library).map(m => m.library))];
  const json = JSON.stringify({ app:'manas', version:1, copyright: COPYRIGHT, credits: CREDITS, exported:new Date().toISOString(), libraries: libs, srs: srsData, maps: list }, null, 1);
  const name = 'manas-backup-' + new Date().toISOString().slice(0,10) + '.json';
  const done = how => { settings.lastBackup = Date.now(); settings.backupSnooze = 0; saveSettings(settings); closeSheet(); renderHome(); if (how) toast(how); };
  const file = new File([json], name, { type:'application/json' });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:t('Manas backup') }); done(''); return; } catch(e){ if (e.name==='AbortError') return; }
  }

}
function backupAge(){ const t = settings.lastBackup; if (!t) return 'never'; const d = Math.floor((Date.now() - t) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
function needsBackup(){ const own = backupMaps(); if (!own.length) return false; const newest = Math.max(...own.map(m => m.updated || 0)); if (settings.lastBackup && newest <= settings.lastBackup) return false; if (settings.backupSnooze && Date.now() < settings.backupSnooze) return false; return !settings.lastBackup ? (Date.now() - Math.min(...own.map(m => m.created || Date.now())) > 2 * 86400000) : (Date.now() - settings.lastBackup > 7 * 86400000); }
function restoreFrom(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => restoreText(String(r.result));

}
function restoreText(text){
  {
    try {
      const obj = JSON.parse(text);
      if (obj && obj.kind === 'move'){ if (location.protocol !== 'file:') receiveMove(obj); return; }   // the app's own hand-off: only the website copy takes it
      const incoming = Array.isArray(obj) ? obj : obj.maps;
      if (obj && obj.srs && typeof obj.srs === 'object'){ for (const [k, v] of Object.entries(obj.srs)){ if (!srs[k] || (v.seen || 0) > (srs[k].seen || 0)) srs[k] = v; } saveSrs(); }
      if (!Array.isArray(incoming)) throw 0;
      let added=0, updated=0;
      for (const m of incoming){ if (!m || !m.data || !m.data.nodeData) continue; const i = maps.findIndex(x=>x.id===m.id);
        if (i<0){ maps.push(m); saveMap(m); added++; } else if ((m.updated||0) > (maps[i].updated||0)){ maps[i]=m; saveMap(m); updated++; } }
      renderHome(); closeSheet(); toast(`Restored: ${added} new, ${updated} updated`);
    } catch(e){ toast(t('That is not a Manas backup')); }
  }
}

/* the phone's maps arriving from the copy inside the app (once, when the app first opens from the website) */
async function receiveMove(obj){
  const s = (obj.settings && typeof obj.settings === 'object') ? obj.settings : {};
  const incoming = (obj.maps || []).filter(m => m && m.data && m.data.nodeData), write = [];
  const libsIn = (obj.libraries || []).map(l => typeof l === 'string' ? { id: l, parts: null } : l).filter(l => l && l.id);
  const returning = incoming.length > 0 || libsIn.length > 0 || Object.keys(obj.srs || {}).length > 0;   // a phone that was used: no first-run picker or tour over its maps
  Object.assign(settings, s, { moveLibs: libsIn }, returning ? { libChosen: true, tourDone: true } : {});
  { const g = document.getElementById('gate'); if (g && !gateOn()) g.remove(); }
  saveSettings(settings); if (s.lang) setLang(s.lang); applyTheme(); if (returning) closeSheet();
  for (const m of incoming){ const i = maps.findIndex(x => x.id === m.id);
    if (i < 0){ maps.push(m); write.push(m); } else if ((m.updated || 0) > (maps[i].updated || 0)){ maps[i] = m; write.push(m); } }
  try { await idb.putAll(write); } catch(e){ toast(t('Could not save on this device')); return; }      // 'moved' stays unset: the app sends everything again next time
  if (obj.srs && typeof obj.srs === 'object'){ for (const [k, v] of Object.entries(obj.srs)){ if (!srs[k] || (v.seen || 0) > (srs[k].seen || 0)) srs[k] = v; } try { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); } catch(e){ return; } }
  try { const b = window.ManasBridge; if (b && b.setPref) b.setPref('moved', '1'); } catch(e){}
  renderHome(); if (incoming.length || settings.moveLibs.length) toast(t('Your maps are here. Manas now updates itself.'));
  resumeMoveLibs();
}
/* libraries that were on the phone come back from the shelf; the list is kept until each one is in, so closing the app halfway loses nothing */
let moveLibsBusy = false;
async function resumeMoveLibs(){
  if (moveLibsBusy || !(settings.moveLibs || []).length) return; moveLibsBusy = true;
  try { await loadCatalog(); const libs = (catalog && catalog.libraries) || [];
    for (const l of [...settings.moveLibs]){ const e = libs.find(x => x.id === l.id);
      if (e){ try { await installLibrary(e, l.parts || null); } catch(err){ continue; } }
      settings.moveLibs = settings.moveLibs.filter(x => x.id !== l.id); saveSettings(settings); }
    renderHome(); } finally { moveLibsBusy = false; }
}

const orbitEl = $('#orbit');

  /* --- adapter: Mind Elixir nodeData → display nodes (real points back to the node) --- */
  function orbitOf(nd){ return (nd.manas && nd.manas.orbit) || {}; }
  function colorOfReal(nd, depth){ const o = orbitOf(nd); return (depth === 1 && nd.branchColor) ? nd.branchColor : (o.color || ''); }
  function toDisp(nd, depth){
    const emo = Array.isArray(nd.icons) && nd.icons[0] ? String(nd.icons[0]) + ' ' : '';
    const o = orbitOf(nd);
    return { id: nd.id, label: emo + (nd.topic || 'Untitled'), ref: o.ref || '', tag: o.tag || '', note: nd.note || '', color: colorOfReal(nd, depth), real: nd,

  /* --- colours --- */
  const THEME_COL = { Karma:'#F29A4A', Jnana:'#7EA6FF', Bhakti:'#F27BB0', Dhyana:'#4CC9B0', Dharma:'#E8C547' };
  const SWATCHES = ['#F29A4A','#E8C547','#8ED36F','#4CC9B0','#7EA6FF','#A98BFF','#F27BB0','#FF7A6B'];
  const hue = (i, n) => 'hsl(' + Math.round((i * 360 / Math.max(n,1) + 18) % 360) + ' 72% 66%)';

  let idx = {}, realIdx = {}, colorOf = {}, dispRoot = null, treeRoot = null;
  function allTags(){ const s = []; walk(rootNd(), (n, p) => { const t = orbitOf(n).tag; if (p && t && s.indexOf(t) < 0) s.push(t); }); return s; }

function agreedVer(doc){ const own = Number(((settings.agreed || {})[doc]) || 0), srv = Number(((acc().signed || {})[doc]) || 0); return Math.max(own, srv); }
function termsDue(){ return !!(POLICIES.terms && agreedVer('terms') < POLICIES.terms.version); }

  const P = POLICIES[doc]; if (!P) return;

  agreeBusy = true;
  try { for (const x of settings.pendingAgree.slice()){ const j = await accCall('agree', x); if (!j.ok) break;
      settings.pendingAgree = settings.pendingAgree.filter(y => y !== x); const a = acc(); a.signed = Object.assign({}, a.signed, { [x.document]: Math.max(Number(x.version), Number((a.signed || {})[x.document] || 0)) }); saveSettings(settings); } }

}

/* 7.29: Admin → People as a table — one row per email, one small one-word button per library. A tap cycles

  const levels = Object.assign({}, acc().levels || {}, j.levels || {});
  const lvOf = e => { const l = String(levels[e.id] || e.access || 'open').toLowerCase(); return l === 'private' ? 'private' : l === 'request' ? 'request' : 'open'; };
  const people = (j.items || []).map(p => ({ email: p.email, status: p.status, devices: p.devices, cells: p.cells || {} }));
  const base = {}; for (const p of people){ base[p.email] = {}; for (const e of libs){ const c = p.cells[e.id]; base[p.email][e.id] = c && c.s !== 'pending' ? c.s : gridDefault(lvOf(e)); } }
  gridState = { libs, people, base, cur: JSON.parse(JSON.stringify(base)), undo: [], q: q || '', mine: j.mine || null, lvOf };

function gridChanges(){ const G = gridState, out = []; for (const p of G.people) for (const e of G.libs){ const a = G.base[p.email][e.id], b = G.cur[p.email][e.id]; if (a !== b) out.push({ email: p.email, lib: e.id, state: b }); } return out; }
function gridCanEdit(id){ const m = gridState.mine; return !m || m.includes(id); }

    const b = window.ManasBridge; if (!b || !booted) return; DIAG.bridge = true; try { DIAG.shell = b.version ? String(b.version()) : ''; } catch(e){}
    const t = b.takeImport && b.takeImport(); if (t && t.length > 2){ DIAG.imports++; restoreText(String(t)); }
  } catch(e){ DIAG.lastError = 'bridge: ' + e; }
}
setInterval(pollBridge, 1200); document.addEventListener('visibilitychange', () => { if (!document.hidden){ pollBridge(); checkLibUpdates(false); if (booted) accessCheck(false); } });
const FEEDBACK_EMAIL = 'kewal@halcyonhealthcareltd.com';
function feedbackSheet(){
  const ep = emailEndpoint();
  sheet(`<h2>${t('Send feedback')}</h2><p class="sub">${t('What annoyed you, what you wished it did, what broke. Short is fine. Speak or type.')}</p>
    <textarea class="field" id="fb-in" rows="5" placeholder="${esc(t("e.g. Couldn't find how to move a bubble"))}"></textarea>
    <div class="row" style="align-items:center">${micBtn('fb-mic')}<span class="tips" id="fb-st" style="flex:1"></span></div>
    <div class="row"><button class="btn" id="fb-no">${t('Cancel')}</button><button class="btn${ep ? '' : ' primary'}" id="fb-ok">${t('Send by email')}</button>${ep ? `<button class="btn primary" id="fb-send">${t('Send to Manas')}</button>` : ''}</div>`, s => {
      const mic = attachMic($('#fb-mic', s), $('#fb-in', s), $('#fb-st', s));
      $('#fb-no',s).onclick = () => { mic.stop(); closeSheet(); };
      $('#fb-ok',s).onclick = () => { mic.stop(); const body = ($('#fb-in',s).value.trim() || '(no text)') + '\n\n— Manas ' + DIAG.version + ' · ' + (location.protocol === 'file:' ? 'installed app' : 'web') + ' · ' + navigator.userAgent.slice(0, 80);
        location.href = 'mailto:' + FEEDBACK_EMAIL + '?subject=' + encodeURIComponent('Manas feedback') + '&body=' + encodeURIComponent(body); closeSheet(); };
      const sd = $('#fb-send', s); if (sd) sd.onclick = () => { const v = $('#fb-in', s).value.trim(); if (!v){ $('#fb-st', s).textContent = t('Say or type something first.'); return; } mic.stop();
        sendFeedback({ kind: 'app', text: v.slice(0, 4000), map: current ? current.id : '', mapTitle: current ? String(current.title || '') : '' }); closeSheet(); sentToast(); };
  });
}
function confirmExternal(href, then){
  let host = ''; try { host = new URL(href).hostname.replace(/^www\./, ''); } catch(e){}
  const yt = /youtube\.com|youtu\.be/.test(host);
  sheet(`<h2>${yt ? t('Open this video?') : t('Leave Manas?')}</h2><p class="sub">${yt ? 'This opens YouTube at the moment this idea was said. The video belongs to its channel, not to Manas.' : 'This opens ' + esc(host || 'a link') + ' outside the app.'}</p>
    <div class="row"><button class="btn" id="ex-no">${t('Stay')}</button><button class="btn primary" id="ex-ok">${yt ? t('Open YouTube') : t('Open')}</button></div>`, s => {
      $('#ex-no',s).onclick = closeSheet; $('#ex-ok',s).onclick = () => { closeSheet(); then(); };
  });
}

    if (studyOpen()){ endStudy(); return 'ok'; }
